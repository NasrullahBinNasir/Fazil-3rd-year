 সৃষ্টিজগতের নিদর্শন, পূর্ববর্তী জাতির পরিণতি, আখিরাতের জবাবদিহি, ঈমানের ওপর অবিচল থাকা এবং উত্তম আচরণের শিক্ষা দেওয়া হয়েছে। তাই সূরা ফুসসিলাত শুধু আকিদাগত বিষয়ের আলোচনা নয়; বরং মানুষের বিশ্বাস, চরিত্র ও কর্মজীবন সংশোধনেরও গুরুত্বপূর্ণ দিকনির্দেশনা। এর শিক্ষাগুলো অনুসরণ করলে মানুষ আল্লাহর সন্তুষ্টি অর্জন এবং সুন্দর জীবন গঠনের পথে অগ্রসর হতে পারে।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">تَحَدَّثْ عَنْ صُوَرِ جَمْعِ الْقُرْآنِ الْكَرِيمِ فِي عَهْدِ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ.</span>রাসুলুল্লাহ ﷺ-এর যুগে কুরআন সংরক্ষণ ও সংকলনের পদ্ধতিগুলো আলোচনা করো।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআনুল কারীম মহান আল্লাহ তাআলার সর্বশেষ আসমানি কিতাব, যা মানবজাতির হিদায়াতের জন্য রাসূলুল্লাহ (সা.)-এর ওপর অবতীর্ণ হয়েছে। কুরআন নাযিল হওয়ার পর থেকেই রাসূলুল্লাহ (সা.) ও সাহাবায়ে কেরাম এর সংরক্ষণে বিশেষ গুরুত্ব দিয়েছেন। রাসূলুল্লাহ (সা.)-এর যুগে কুরআন সংরক্ষণের প্রধান দুটি পদ্ধতি ছিল—বক্ষস্থলে মুখস্থ রাখা এবং বিভিন্ন লেখার উপকরণে লিখে রাখা। তবে সে সময় কুরআন পরবর্তী যুগের মতো একটি মলাটবদ্ধ গ্রন্থে একত্র করা হয়নি। নিম্নে রাসূলুল্লাহ (সা.)-এর যুগে কুরআন একত্রীকরণ ও সংরক্ষণের বিভিন্ন পদ্ধতি বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">রাসূলুল্লাহ (সা.)-এর যুগে কুরআন একত্রীকরণের পদ্ধতি:</div><p><b>১. কুরআন মুখস্থকরণের মাধ্যমে সংরক্ষণ</b></p><p>রাসূলুল্লাহ (সা.)-এর যুগে কুরআন সংরক্ষণের সবচেয়ে গুরুত্বপূর্ণ পদ্ধতি ছিল মুখস্থকরণ। আরবদের স্মৃতিশক্তি ও মুখস্থ করার ঐতিহ্য ছিল অত্যন্ত শক্তিশালী। রাসূলুল্লাহ (সা.) নিজে কুরআন মুখস্থ করতেন এবং সাহাবিদেরও মুখস্থ করার নির্দেশ ও উৎসাহ দিতেন। সাহাবিগণ কুরআনের আয়াত নাযিল হওয়ার সঙ্গে সঙ্গে তা মুখস্থ করে নিতেন এবং নিয়মিত তিলাওয়াতের মাধ্যমে স্মরণ রাখতেন।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div><div class=\"tr\">“নিশ্চয়ই আমিই উপদেশবাণী অবতীর্ণ করেছি এবং নিশ্চয়ই আমিই তার সংরক্ষণকারী।”</div><div class=\"rf\">—সূরা আল-হিজর: ৯</div></div><p>এ আয়াত কুরআন সংরক্ষণের ব্যাপারে আল্লাহর প্রতিশ্রুতি প্রকাশ করে। রাসূলুল্লাহ (সা.)-এর যুগে সাহাবিদের মুখস্থকরণ ছিল এই সংরক্ষণপ্রক্রিয়ার অন্যতম প্রধান মাধ্যম।</p><p><b>২. রাসূলুল্লাহ (সা.)-এর তিলাওয়াত ও সাহাবিদের শিক্ষা প্রদান</b></p><p>রাসূলুল্লাহ (সা.) সাহাবিদের কুরআন তিলাওয়াত করে শোনাতেন এবং তাঁদের কুরআন শিক্ষা দিতেন। সাহাবিগণ তাঁর কাছ থেকে সরাসরি আয়াতের বিশুদ্ধ পাঠ শিখতেন। তাঁরা কেবল আয়াত মুখস্থ করতেন না; বরং এর সঠিক উচ্চারণ, তিলাওয়াতের পদ্ধতি এবং অর্থও শিক্ষা গ্রহণ করতেন।</p><p>জিবরাইল (আ.) রাসূলুল্লাহ (সা.)-এর কাছে কুরআন নিয়ে আসতেন এবং রাসূলুল্লাহ (সা.) তা গ্রহণ করতেন। সহিহ বুখারিতে ইবন আব্বাস (রা.) থেকে বর্ণিত হয়েছে, প্রতি বছর রমজানে জিবরাইল (আ.) রাসূলুল্লাহ (সা.)-এর সঙ্গে কুরআন পুনরাবৃত্তি করতেন এবং তাঁর জীবনের শেষ বছরে দুইবার পুনরাবৃত্তি করেন। (সহিহ আল-বুখারি, হাদিস: ৪৯৯৮)</p><p>এভাবে নিয়মিত তিলাওয়াত ও পুনরাবৃত্তির মাধ্যমে কুরআনের পাঠ সংরক্ষিত হতো।</p><p><b>৩. ওহি লেখকদের মাধ্যমে কুরআন লিখে রাখা</b></p><p>রাসূলুল্লাহ (সা.)-এর যুগে কুরআন সংরক্ষণের আরেকটি গুরুত্বপূর্ণ পদ্ধতি ছিল লিখিতভাবে সংরক্ষণ। কুরআনের আয়াত নাযিল হলে রাসূলুল্লাহ (সা.) ওহি লেখকদের তা লিখে রাখার নির্দেশ দিতেন। তাঁদের মধ্যে যায়েদ ইবন সাবিত (রা.), উবাই ইবন কাব (রা.), আলী ইবন আবি তালিব (রা.) এবং আরও কয়েকজন সাহাবি ছিলেন।</p><p>ওহি লেখকগণ রাসূলুল্লাহ (সা.)-এর নির্দেশ অনুযায়ী আয়াত লিখে রাখতেন। এর ফলে কুরআনের পাঠ শুধু মানুষের স্মৃতির ওপর নির্ভরশীল থাকেনি; বরং লিখিতভাবেও সংরক্ষিত হয়েছিল।</p><p><b>৪. বিভিন্ন লেখার উপকরণে কুরআন লিপিবদ্ধ করা</b></p><p>রাসূলুল্লাহ (সা.)-এর যুগে কাগজের ব্যাপক প্রচলন না থাকায় সাহাবিগণ বিভিন্ন উপকরণে কুরআনের আয়াত লিখে রাখতেন। যেমন—</p><p>ক. চামড়া ও চামড়ার পাতলা টুকরা।</p><p>খ. খেজুরগাছের ডাল ও প্রশস্ত পাতা।</p><p>গ. পাথরের পাতলা ফলক।</p><p>ঘ. পশুর কাঁধের হাড় ও অন্যান্য উপযোগী হাড়।</p><p>ঙ. কাঠের ফলক এবং সে সময়ে প্রচলিত অন্যান্য লেখার উপকরণ।</p><p>এসব উপকরণে কুরআনের আয়াত লিখে রাখা হতো। বিভিন্ন সাহাবির কাছে লিখিত আয়াতের অংশ সংরক্ষিত ছিল। ফলে মুখস্থকরণের পাশাপাশি লিখিত সংরক্ষণের ব্যবস্থাও গড়ে উঠেছিল।</p><p><b>৫. আয়াতের অবস্থান ও বিন্যাস রাসূলুল্লাহ (সা.)-এর নির্দেশে নির্ধারণ</b></p><p>কুরআনের আয়াতগুলো কোন সূরায় এবং কোন স্থানে থাকবে, সে বিষয়ে রাসূলুল্লাহ (সা.) ওহির নির্দেশ অনুযায়ী সাহাবিদের জানিয়ে দিতেন। কোনো আয়াত নাযিল হলে তিনি ওহি লেখকদের নির্দিষ্ট সূরার নির্দিষ্ট স্থানে তা লিখে রাখার নির্দেশ দিতেন।</p><p>উসমান ইবন আবুল আস (রা.) থেকে বর্ণিত হয়েছে যে, কোনো আয়াত নাযিল হলে রাসূলুল্লাহ (সা.) ওহি লেখকদের তার অবস্থান সম্পর্কে নির্দেশ দিতেন। এ ধরনের বর্ণনা থেকে বোঝা যায়, কুরআনের আয়াতের বিন্যাস রাসূলুল্লাহ (সা.)-এর নির্দেশনার অধীন ছিল।</p><p>এভাবে আয়াতের অবস্থান নির্ধারিত হওয়ায় কুরআনের পাঠ ও বিন্যাস সংরক্ষিত হয়েছিল। তবে সূরাগুলোর বর্তমান ধারাবাহিক বিন্যাসের সব দিক সম্পর্কে আলেমদের মধ্যে বিস্তারিত আলোচনা রয়েছে।</p><p><b>৬. নামাজ ও অন্যান্য ইবাদতে কুরআন তিলাওয়াত</b></p><p>রাসূলুল্লাহ (সা.) ও সাহাবায়ে কেরাম নামাজে কুরআন তিলাওয়াত করতেন। বিশেষত ফজর, মাগরিব, এশা ও রাতের নামাজে কুরআনের বিভিন্ন অংশ পাঠ করা হতো। এর ফলে কুরআনের আয়াত নিয়মিত চর্চা ও পুনরাবৃত্তির মাধ্যমে সংরক্ষিত থাকত।</p><p>এ ছাড়া সাহাবিগণ ব্যক্তিগত ইবাদত, শিক্ষা ও পারস্পরিক আলোচনায় কুরআন তিলাওয়াত করতেন। কুরআনের নিয়মিত তিলাওয়াত মুখস্থকরণকে শক্তিশালী করত এবং পাঠের বিশুদ্ধতা বজায় রাখতে সাহায্য করত।</p><p><b>৭. কুরআন শিক্ষা ও পারস্পরিক যাচাই</b></p><p>সাহাবায়ে কেরাম পরস্পরের কাছ থেকে কুরআন শিখতেন, মুখস্থকৃত আয়াত পুনরাবৃত্তি করতেন এবং রাসূলুল্লাহ (সা.)-এর কাছে নিজেদের পাঠ যাচাই করতেন। রাসূলুল্লাহ (সা.) তাঁদের কুরআন শিক্ষা দিতেন এবং ভুল হলে সংশোধন করে দিতেন।</p><p>এভাবে কুরআনের পাঠ ব্যক্তিগত স্মৃতির মধ্যে সীমাবদ্ধ থাকেনি; বরং সাহাবিদের সম্মিলিত শিক্ষা ও চর্চার মাধ্যমে তা ব্যাপকভাবে ছড়িয়ে পড়েছিল। বিভিন্ন সাহাবি কুরআন শিক্ষাদানে বিশেষ খ্যাতি অর্জন করেন। তাঁদের মাধ্যমে পরবর্তী প্রজন্মের কাছেও কুরআনের পাঠ পৌঁছে যায়।</p><p><b>৮. জিবরাইল (আ.)-এর সঙ্গে কুরআন পুনরাবৃত্তি</b></p><p>রাসূলুল্লাহ (সা.)-এর যুগে কুরআন সংরক্ষণের অন্যতম গুরুত্বপূর্ণ দিক ছিল জিবরাইল (আ.)-এর সঙ্গে নিয়মিত কুরআন পুনরাবৃত্তি। সহিহ বুখারির বর্ণনা অনুযায়ী, প্রতি রমজানে জিবরাইল (আ.) রাসূলুল্লাহ (সা.)-এর সঙ্গে কুরআন পর্যালোচনা করতেন। তাঁর জীবনের শেষ বছরে এই পর্যালোচনা দুইবার হয়।</p><p>এ ঘটনাকে উলামায়ে কেরাম ‘আল-আরদাহ আল-আখিরাহ’ বা শেষবারের মতো কুরআন উপস্থাপন ও পর্যালোচনা হিসেবে আলোচনা করেছেন। এটি কুরআনের পাঠ সংরক্ষণ ও পরবর্তী সংকলনের ইতিহাসে বিশেষ গুরুত্ব বহন করে।</p><p><b>৯. এক মলাটে পূর্ণাঙ্গ গ্রন্থ হিসেবে সংকলন না করা</b></p><p>রাসূলুল্লাহ (সা.)-এর যুগে কুরআন মুখস্থ এবং লিখিত—উভয়ভাবেই সংরক্ষিত ছিল। কিন্তু সে সময় সব আয়াতকে একত্র করে একটি মলাটের মধ্যে পূর্ণাঙ্গ মুসহাফ তৈরি করা হয়নি।</p><p>এর কয়েকটি কারণ ছিল। প্রথমত, রাসূলুল্লাহ (সা.)-এর জীবদ্দশায় ওহি নাযিল অব্যাহত ছিল। দ্বিতীয়ত, কোনো কোনো বিধানের নাসখের সম্ভাবনা ছিল। তৃতীয়ত, নতুন আয়াত নাযিল হলে রাসূলুল্লাহ (সা.) তার অবস্থান নির্ধারণ করে দিতেন। ফলে ওহি নাযিল সম্পূর্ণ হওয়ার আগে চূড়ান্তভাবে একটি মলাটবদ্ধ গ্রন্থ প্রস্তুত করার প্রয়োজন দেখা দেয়নি।</p><p>রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর আবু বকর (রা.)-এর খিলাফতকালে ইয়ামামার যুদ্ধে বহু কুরআন-হাফেজ শহিদ হওয়ার প্রেক্ষাপটে কুরআনকে একত্রে সংকলনের উদ্যোগ নেওয়া হয়। পরে উসমান (রা.)-এর খিলাফতকালে মুসলিমদের মধ্যে পাঠের ঐক্য প্রতিষ্ঠার জন্য প্রামাণ্য মুসহাফের অনুলিপি প্রস্তুত করে বিভিন্ন অঞ্চলে পাঠানো হয়। তবে এগুলো ছিল রাসূলুল্লাহ (সা.)-এর যুগের পরবর্তী ঘটনা।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, রাসূলুল্লাহ (সা.)-এর যুগে আল-কুরআনুল কারীম সংরক্ষণ ও একত্রীকরণের বিভিন্ন পদ্ধতি অনুসরণ করা হয়েছিল। এর মধ্যে ছিল মুখস্থকরণ, ওহি লেখকদের মাধ্যমে লিখে রাখা, বিভিন্ন লেখার উপকরণ ব্যবহার, আয়াতের অবস্থান নির্ধারণ, নামাজে তিলাওয়াত, পারস্পরিক শিক্ষা ও যাচাই এবং জিবরাইল (আ.)-এর সঙ্গে নিয়মিত কুরআন পুনরাবৃত্তি। যদিও সে সময় কুরআন একটি মলাটবদ্ধ গ্রন্থে সংকলিত হয়নি, তবুও মুখস্থ ও লিখিত—উভয় পদ্ধতিতে তা সংরক্ষিত ছিল। পরবর্তীকালে আবু বকর (রা.) ও উসমান (রা.)-এর যুগে যথাক্রমে সংকলন ও মানসম্মত মুসহাফ প্রস্তুতের মাধ্যমে কুরআন সংরক্ষণের ঐতিহাসিক প্রক্রিয়া আরও সুসংগঠিত হয়।</p>"],["<small class=\"yr\">সাল: ২০২১, ২০১৯, ২০১৭</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">ماذا تعلم عن اول ما نزل من القرآن واخر ما نزل منه؟ بين رايك مع بيان اراء العلماء فى ذلك بالتفصيل</span>কুরআনের প্রথম অবতীর্ণ ও শেষ অবতীর্ণ আয়াত সম্পর্কে তুমি কী জান? বিস্তারিতভাবে আলেমগণের মতামত বর্ণনাপূর্বক এ বিষয়ে তোমার বক্তব্য পেশ কর।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআন মহান আল্লাহ তাআলার সর্বশেষ আসমানি কিতাব, যা হযরত মুহাম্মদ (সা.)-এর ওপর দীর্ঘ প্রায় তেইশ বছর ধরে পর্যায়ক্রমে অবতীর্ণ হয়েছে। কুরআনের কোন আয়াত সর্বপ্রথম নাজিল হয়েছিল এবং কোন আয়াত সর্বশেষ নাজিল হয়েছিল—এ বিষয়ে উলুমুল কুরআনের আলেমগণ বিস্তারিত আলোচনা করেছেন। প্রথম অবতীর্ণ আয়াত সম্পর্কে আলেমদের মধ্যে শক্তিশালী ও প্রসিদ্ধ মত রয়েছে। তবে সর্বশেষ অবতীর্ণ আয়াত সম্পর্কে একাধিক মত পাওয়া যায়। হাদিস ও সাহাবিদের বর্ণনার ভিত্তিতে এসব মত বিশ্লেষণ করলে বিষয়টি স্পষ্ট হয়।</p><div class=\"h\">প্রথম অবতীর্ণ আয়াত সম্পর্কে আলেমদের মতামত:</div><p><b>১. সর্বপ্রথম সূরা আল-আলাকের প্রথম পাঁচ আয়াত নাজিল হয়</b></p><p>অধিকাংশ আলেমের মতে, কুরআনের সর্বপ্রথম অবতীর্ণ আয়াত হলো সূরা আল-আলাকের প্রথম পাঁচ আয়াত। হেরা গুহায় অবস্থানকালে ফেরেশতা জিবরাইল (আ.) রাসুলুল্লাহ (সা.)-এর কাছে প্রথম ওহি নিয়ে আসেন। এ সময় তাঁকে পাঠ করতে নির্দেশ দেওয়া হয়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ ۝ خَلَقَ الْإِنْسَانَ مِنْ عَلَقٍ ۝ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ ۝ الَّذِي عَلَّمَ بِالْقَلَمِ ۝ عَلَّمَ الْإِنْسَانَ مَا لَمْ يَعْلَمْ</div><div class=\"tr\">“পাঠ করুন আপনার রবের নামে, যিনি সৃষ্টি করেছেন। তিনি মানুষকে জমাট রক্তপিণ্ড থেকে সৃষ্টি করেছেন। পাঠ করুন, আর আপনার রব মহামহিমান্বিত। যিনি কলমের সাহায্যে শিক্ষা দিয়েছেন। মানুষকে শিক্ষা দিয়েছেন, যা সে জানত না।”</div><div class=\"rf\">—সূরা আল-আলাক: ১–৫</div></div><p>হযরত আয়েশা (রা.) থেকে বর্ণিত, রাসুলুল্লাহ (সা.)-এর কাছে ওহির সূচনা হয় সত্য স্বপ্নের মাধ্যমে। এরপর তিনি হেরা গুহায় নির্জনে ইবাদত করতেন। সেখানে ফেরেশতা এসে তাঁকে বললেন, “পড়ুন।” এরপর সূরা আল-আলাকের প্রথম আয়াতগুলো নাজিল হয়।</p><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ৩</div><p>এই হাদিস প্রথম ওহি সম্পর্কে সবচেয়ে গুরুত্বপূর্ণ ও নির্ভরযোগ্য দলিল। তাই অধিকাংশ আলেমের মতে, সূরা আল-আলাকের প্রথম পাঁচ আয়াতই সর্বপ্রথম অবতীর্ণ হয়েছে।</p><p><b>২. সূরা আল-মুদ্দাসসিরের প্রথম আয়াতগুলো নাজিল হওয়ার মত</b></p><p>কিছু বর্ণনায় সূরা আল-মুদ্দাসসিরের প্রথম আয়াতগুলোকে প্রথম অবতীর্ণ আয়াত হিসেবে উল্লেখ করা হয়েছে। আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الْمُدَّثِّرُ ۝ قُمْ فَأَنْذِرْ ۝ وَرَبَّكَ فَكَبِّرْ ۝ وَثِيَابَكَ فَطَهِّرْ ۝ وَالرُّجْزَ فَاهْجُرْ</div><div class=\"tr\">“হে চাদরাবৃত ব্যক্তি! উঠুন, সতর্ক করুন। আপনার রবের মহিমা ঘোষণা করুন। আপনার পোশাক পবিত্র রাখুন। আর অপবিত্রতা থেকে দূরে থাকুন।”</div><div class=\"rf\">—সূরা আল-মুদ্দাসসির: ১–৫</div></div><p>জাবির ইবনে আবদুল্লাহ (রা.)-এর বর্ণনায় রাসুলুল্লাহ (সা.) প্রথম ওহির বিরতির পর পুনরায় ওহি নাজিল হওয়ার ঘটনা বর্ণনা করেছেন। এ সময় সূরা আল-মুদ্দাসসিরের আয়াতগুলো নাজিল হয়।</p><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ৪</div><p>আলেমগণ এ দুই ধরনের বর্ণনার মধ্যে সমন্বয় করেছেন। তাঁদের মতে, সূরা আল-আলাকের প্রথম পাঁচ আয়াত ছিল একেবারে প্রথম অবতীর্ণ ওহি। আর সূরা আল-মুদ্দাসসিরের প্রথম আয়াতগুলো ছিল ওহির বিরতির পর নবুওয়াতের দাওয়াত প্রকাশ্যে শুরু করার নির্দেশনাসংবলিত প্রথম আয়াতগুলোর অন্যতম। এভাবে উভয় বর্ণনার মধ্যে প্রকৃতপক্ষে বিরোধ থাকে না।</p><div class=\"h\">শেষ অবতীর্ণ আয়াত সম্পর্কে আলেমদের মতামত:</div><p>কুরআনের সর্বশেষ অবতীর্ণ আয়াত নির্ধারণের ক্ষেত্রে সাহাবায়ে কিরাম ও আলেমদের মধ্যে একাধিক মত রয়েছে। এর কারণ হলো, বিভিন্ন সাহাবি তাঁদের জানা সর্বশেষ ওহি বা কোনো নির্দিষ্ট বিধান-সম্পর্কিত সর্বশেষ আয়াতের কথা বর্ণনা করেছেন। এ বিষয়ে প্রধান মতগুলো নিম্নে আলোচনা করা হলো।</p><p><b>৩. সূরা আল-বাকারার ২৮১ নম্বর আয়াত সর্বশেষ নাজিল হওয়ার মত</b></p><p>অনেক আলেমের মতে, কুরআনের সর্বশেষ অবতীর্ণ আয়াত হলো সূরা আল-বাকারার ২৮১ নম্বর আয়াত। এ মতের পক্ষে হযরত আবদুল্লাহ ইবনে আব্বাস (রা.)-এর বর্ণনা রয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ</div><div class=\"tr\">“তোমরা সেই দিনকে ভয় করো, যেদিন তোমাদের আল্লাহর কাছে ফিরিয়ে নেওয়া হবে। অতঃপর প্রত্যেক ব্যক্তিকে তার উপার্জনের পূর্ণ প্রতিদান দেওয়া হবে এবং তাদের প্রতি কোনো অবিচার করা হবে না।”</div><div class=\"rf\">—সূরা আল-বাকারা: ২৮১</div></div><p>এই আয়াতে আখিরাতের জবাবদিহি, মানুষের কর্মের প্রতিদান এবং আল্লাহর ন্যায়বিচারের কথা বলা হয়েছে। হযরত ইবনে আব্বাস (রা.) থেকে বর্ণিত হয়েছে যে, এ আয়াতটি ছিল কুরআনের সর্বশেষ অবতীর্ণ আয়াত।</p><div class=\"rf\">—সুনান আন-নাসাঈ, তাফসির-সম্পর্কিত বর্ণনা; এ মতের আলোচনা তাফসির ইবনে কাসিরেও রয়েছে</div><p><b>৪. সূরা আল-বাকারার সুদ-সম্পর্কিত আয়াত সর্বশেষ নাজিল হওয়ার মত</b></p><p>আরেকটি প্রসিদ্ধ মত হলো, সুদ সম্পর্কে নাজিল হওয়া আয়াতগুলো কুরআনের সর্বশেষ অবতীর্ণ অংশ। হযরত আবদুল্লাহ ইবনে আব্বাস (রা.) থেকে বর্ণিত হয়েছে—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">آخِرُ آيَةٍ نَزَلَتْ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ آيَةُ الرِّبَا</div><div class=\"tr\">“নবী (সা.)-এর ওপর সর্বশেষ যে আয়াত নাজিল হয়েছিল, তা ছিল সুদ-সম্পর্কিত আয়াত।”</div><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ৪৫৪৪</div></div><p>এখানে সুদ-সম্পর্কিত আয়াত বলতে সূরা আল-বাকারার ২৭৮–২৮১ নম্বর আয়াতের ধারাবাহিক আলোচনাকে বোঝানো হতে পারে। বিশেষত ২৮১ নম্বর আয়াতে আল্লাহর কাছে প্রত্যাবর্তন ও জবাবদিহির কথা বলা হয়েছে। এ কারণে অনেক আলেম সুদ-সম্পর্কিত বর্ণনা এবং ২৮১ নম্বর আয়াতের বর্ণনার মধ্যে সমন্বয় করেছেন।</p><p><b>৫. সূরা আন-নিসার ১৭৬ নম্বর আয়াত সর্বশেষ নাজিল হওয়ার মত</b></p><p>হযরত বারা ইবনে আযিব (রা.)-এর বর্ণনা অনুযায়ী, কুরআনের সর্বশেষ অবতীর্ণ আয়াত হলো কালালা-সম্পর্কিত আয়াত, যা সূরা আন-নিসার ১৭৬ নম্বর আয়াত।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ</div><div class=\"tr\">“তারা আপনার কাছে বিধান জানতে চায়। বলুন, আল্লাহ তোমাদের কালালা সম্পর্কে বিধান দিচ্ছেন।”</div><div class=\"rf\">—সূরা আন-নিসা: ১৭৬-এর অংশ</div></div><p>এ আয়াতে এমন ব্যক্তির উত্তরাধিকার-সংক্রান্ত বিধান আলোচনা করা হয়েছে, যার সরাসরি ঊর্ধ্বতন ও অধস্তন উত্তরাধিকারী নেই—ফিকহের পরিভাষায় যার অবস্থাকে কালালা বলা হয়।</p><p>হযরত বারা ইবনে আযিব (রা.) বলেন, কালালা-সম্পর্কিত আয়াতটি সর্বশেষ নাজিল হয়েছিল এবং সর্বশেষ পূর্ণাঙ্গ সূরা ছিল সূরা বারাআত, অর্থাৎ সূরা আত-তাওবা।</p><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ৪৬৫৪; সহিহ মুসলিম, হাদিস: ১৬১৮</div><p><b>৬. সূরা আল-মায়িদা অথবা সূরা আত-তাওবার শেষাংশ সর্বশেষ নাজিল হওয়ার মত</b></p><p>কিছু বর্ণনায় হযরত আয়েশা (রা.)-এর পক্ষ থেকে সূরা আল-মায়িদাকে সর্বশেষ অবতীর্ণ সূরা হিসেবে উল্লেখ করা হয়েছে। আবার হযরত উবাই ইবনে কাব (রা.)-এর সূত্রে সূরা আত-তাওবার শেষাংশের আয়াতসমূহ সর্বশেষ অবতীর্ণ হওয়ার মতও পাওয়া যায়।</p><p>আল্লাহ তাআলা সূরা আল-মায়িদায় বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا</div><div class=\"tr\">“আজ আমি তোমাদের জন্য তোমাদের দ্বীনকে পূর্ণাঙ্গ করলাম, তোমাদের প্রতি আমার নিয়ামত সম্পূর্ণ করলাম এবং ইসলামকে তোমাদের দ্বীন হিসেবে মনোনীত করলাম।”</div><div class=\"rf\">—সূরা আল-মায়িদা: ৩-এর অংশ</div></div><p>এ আয়াত বিদায় হজের সময় আরাফার দিনে নাজিল হয়েছিল বলে সহিহ বর্ণনায় উল্লেখ রয়েছে। তবে দ্বীন পূর্ণাঙ্গ হওয়ার ঘোষণা এবং কুরআনের একেবারে সর্বশেষ আয়াত নাজিল হওয়া একই বিষয় নয়। তাই এ আয়াতকে সর্বশেষ অবতীর্ণ আয়াত হিসেবে নিশ্চিতভাবে চিহ্নিত করা যায় না।</p><p><b>৭. আলেমদের মতামতের মধ্যে সমন্বয় ও প্রাধান্যপ্রাপ্ত মত</b></p><p>উপরোক্ত মতগুলো পর্যালোচনা করলে বোঝা যায়, সর্বশেষ অবতীর্ণ আয়াত সম্পর্কে একাধিক সাহাবির বর্ণনা রয়েছে। ইমাম জালালুদ্দিন আস-সুয়ূতি তাঁর আল-ইতকান ফি উলুমিল কুরআন গ্রন্থে এ বিষয়ে বিভিন্ন মত সংকলন করেছেন। হাফিজ ইবনে হাজার আল-আসকালানি ফাতহুল বারি গ্রন্থে এ মতগুলোর আলোচনা করেছেন।</p><p>আলেমদের সমন্বয়মূলক ব্যাখ্যা হলো, কোনো সাহাবি নির্দিষ্ট বিধান-সম্পর্কিত সর্বশেষ আয়াতের কথা বলেছেন, যেমন সুদ বা উত্তরাধিকার-সংক্রান্ত আয়াত। অন্য কেউ সামগ্রিকভাবে সর্বশেষ নাজিল হওয়া আয়াতের কথা বলেছেন। আবার কেউ সর্বশেষ পূর্ণাঙ্গ সূরার কথা উল্লেখ করেছেন। এভাবে বর্ণনাগুলোর মধ্যে সমন্বয় করা সম্ভব।</p><div class=\"h\">আমার মতামত:</div><p>আমার মতে, প্রথম অবতীর্ণ আয়াত সম্পর্কে সূরা আল-আলাকের প্রথম পাঁচ আয়াতের মতটি সবচেয়ে শক্তিশালী, কারণ হযরত আয়েশা (রা.)-এর বর্ণিত সহিহ আল-বুখারির হাদিসে এ বিষয়ে সুস্পষ্ট বিবরণ রয়েছে।</p><p>সর্বশেষ অবতীর্ণ আয়াতের ক্ষেত্রে সূরা আল-বাকারার ২৮১ নম্বর আয়াতকে প্রাধান্য দেওয়া যুক্তিসংগত। কারণ হযরত ইবনে আব্বাস (রা.)-এর বর্ণনা এবং বহু মুফাসসিরের আলোচনা এ মতকে সমর্থন করে। তবে বিষয়টি সম্পর্কে চূড়ান্ত সিদ্ধান্ত দেওয়ার ক্ষেত্রে সতর্ক থাকা উচিত, কারণ সর্বশেষ আয়াত নির্ধারণে রাসুলুল্লাহ (সা.) থেকে এমন কোনো দ্ব্যর্থহীন, সর্বসম্মত বর্ণনা নেই, যা অন্য সব মতকে সম্পূর্ণ বাতিল করে দেয়।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, কুরআনের সর্বপ্রথম অবতীর্ণ আয়াত হলো সূরা আল-আলাকের প্রথম পাঁচ আয়াত—এটি অধিকাংশ আলেমের কাছে গ্রহণযোগ্য মত। আর সর্বশেষ অবতীর্ণ আয়াত সম্পর্কে সূরা আল-বাকারার ২৮১ নম্বর আয়াত, সুদ-সম্পর্কিত আয়াত এবং সূরা আন-নিসার ১৭৬ নম্বর আয়াতসহ একাধিক মত রয়েছে। এসব মতের মধ্যে সমন্বয় করে দলিলের ভিত্তিতে সিদ্ধান্ত গ্রহণ করাই সঠিক পদ্ধতি। আল্লাহ তাআলাই সর্বাধিক জ্ঞাত।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">ما معنى النسخ لغة واصطلاحا؟ هل يجوز نسخ القرآن بالسنة؟ بين بالوضاحة</span>নাসখ-এর আভিধানিক ও পারিভাষিক অর্থ কী? সুন্নাহ দ্বারা কুরআন রহিত হওয়া কি বৈধ? পরিষ্কারভাবে বর্ণনা কর।","<div class=\"h\">ভূমিকা:</div><p>ইসলামি শরিয়তের বিধানসমূহ অনুধাবনের ক্ষেত্রে নাসখ বা রহিতকরণ উলূমুল কুরআন ও উসূলুল ফিকহের একটি গুরুত্বপূর্ণ বিষয়। আল্লাহ তাআলা তাঁর হিকমত ও প্রজ্ঞা অনুযায়ী কোনো বিধানের পরিবর্তে অন্য বিধান প্রদান করেছেন। কুরআনের কিছু বিধান পরবর্তী বিধানের মাধ্যমে রহিত হয়েছে। তাই নাসখের অর্থ, এর পারিভাষিক সংজ্ঞা এবং সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়ার বৈধতা সম্পর্কে জানা জরুরি।</p><div class=\"h\">নাসখের আভিধানিক অর্থ:</div><p>النسخ শব্দটি আরবি نسخ ধাতু থেকে গঠিত। এর আভিধানিক অর্থ কয়েকটি—</p><p><b>১. অপসারণ করা:</b> কোনো বস্তু বা বিষয়কে সরিয়ে দেওয়া।</p><p><b>২. পরিবর্তন করা:</b> কোনো বিষয়ের অবস্থার পরিবর্তন ঘটানো।</p><p><b>৩. স্থানান্তর করা:</b> এক স্থান থেকে অন্য স্থানে কোনো বিষয় স্থানান্তর করা।</p><p><b>৪. অনুলিপি করা:</b> কোনো লেখা বা বিষয়কে অন্য স্থানে নকল করা।</p><p>উলূমুল কুরআনের আলোচনায় নাসখের সঙ্গে প্রধানত অপসারণ ও পরিবর্তনের অর্থ সম্পর্কিত।</p><div class=\"h\">নাসখের পারিভাষিক সংজ্ঞা:</div><p>ইসলামি শরিয়তের পরিভাষায়, পূর্ববর্তী কোনো শরয়ি বিধানকে পরবর্তী শরয়ি দলিলের মাধ্যমে রহিত করা বা তার কার্যকারিতা সমাপ্ত করাকে নাসখ বলে।</p><p>অর্থাৎ, আল্লাহ তাআলা কোনো নির্দিষ্ট সময়ে একটি বিধান প্রদান করেন এবং পরে তাঁরই পক্ষ থেকে অন্য বিধান অবতীর্ণ হয়, যা পূর্ববর্তী বিধানের পরিবর্তে কার্যকর হয়। একে নাসখ বলা হয়।</p><p>এখানে উল্লেখ্য, নাসখের মাধ্যমে আল্লাহর জ্ঞান বা সিদ্ধান্তে কোনো পরিবর্তন ঘটে না। বরং আল্লাহর চিরন্তন জ্ঞান অনুযায়ী নির্ধারিত সময়ে বান্দাদের জন্য বিধান পরিবর্তিত হয়।</p><div class=\"h\">কুরআনে নাসখের প্রমাণ:</div><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُنْسِهَا نَأْتِ بِخَيْرٍ مِنْهَا أَوْ مِثْلِهَا أَلَمْ تَعْلَمْ أَنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ</div><div class=\"tr\">“আমি কোনো আয়াত রহিত করলে অথবা তা ভুলিয়ে দিলে তার চেয়ে উত্তম কিংবা তার অনুরূপ কোনো আয়াত নিয়ে আসি। তুমি কি জানো না যে, নিশ্চয়ই আল্লাহ সবকিছুর ওপর ক্ষমতাবান?”</div><div class=\"rf\">—সূরা আল-বাকারা: ১০৬</div></div><p>এ আয়াত থেকে বোঝা যায়, আল্লাহ তাআলা তাঁর প্রজ্ঞা অনুযায়ী কোনো বিধান রহিত করে তার পরিবর্তে উত্তম বা অনুরূপ বিধান প্রদান করতে পারেন।</p><div class=\"h\">সুন্নাহ দ্বারা কুরআন রহিত হওয়ার বিধান:</div><p>সুন্নাহ দ্বারা কুরআন রহিত হওয়া যায় কি না—এ বিষয়ে উসূলুল ফিকহের আলেমদের মধ্যে মতভেদ রয়েছে। বিষয়টি পরিষ্কারভাবে বোঝার জন্য কয়েকটি দিক আলোচনা করা হলো।</p><p><b>১. কুরআন ও সুন্নাহর পরিচয়</b></p><p>কুরআন হলো আল্লাহ তাআলার সেই কালাম, যা জিবরাইল (আ.)-এর মাধ্যমে রাসুলুল্লাহ (সা.)-এর ওপর অবতীর্ণ হয়েছে এবং যার তিলাওয়াত ইবাদত।</p><p>সুন্নাহ হলো রাসুলুল্লাহ (সা.)-এর কথা, কাজ ও সম্মতিসূচক আচরণ, যা শরিয়তের দলিল হিসেবে বিবেচিত।</p><p>কুরআন ও সুন্নাহ উভয়ই শরিয়তের গুরুত্বপূর্ণ দলিল। তবে কুরআন ও সুন্নাহর মর্যাদা, প্রমাণের ধরন এবং বিধান প্রতিষ্ঠার পদ্ধতি এক নয়। তাই সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়ার প্রশ্নটি আলেমগণ পৃথকভাবে আলোচনা করেছেন।</p><p><b>২. সুন্নাহ দ্বারা কুরআন রহিত হওয়ার ক্ষেত্রে আলেমদের মতভেদ</b></p><p>এ বিষয়ে আলেমদের প্রধানত দুটি মত রয়েছে।</p><p>প্রথম মত হলো, সাধারণভাবে সুন্নাহ দ্বারা কুরআন রহিত করা যায় না। বিশেষ করে হানাফি উসূলবিদদের আলোচনায় কুরআনের বিধান রহিত করার জন্য সমমানের বা তার চেয়ে শক্তিশালী দলিলের প্রয়োজনীয়তার ওপর গুরুত্ব দেওয়া হয়েছে। তাঁদের মতে, মুতাওয়াতির সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়ার সম্ভাবনা স্বীকৃত হলেও এ ক্ষেত্রে কঠোর শর্ত রয়েছে; খবরে ওয়াহিদ দ্বারা কুরআন রহিত করা যায় না।</p><p>দ্বিতীয় মত হলো, আল্লাহর পক্ষ থেকে প্রমাণিত রাসুলুল্লাহ (সা.)-এর সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়া নীতিগতভাবে সম্ভব। এ মতের সমর্থকদের মধ্যে এমন আলেম রয়েছেন, যাঁরা সহিহ সুন্নাহর প্রমাণমূল্য এবং কুরআন-সুন্নাহর পারস্পরিক সম্পর্কের ভিত্তিতে বিষয়টি আলোচনা করেছেন। তবে তাঁরা সুন্নাহর নির্ভরযোগ্যতা ও নাসখের শর্তগুলোকেও গুরুত্ব দেন।</p><p>সুতরাং, এ বিষয়ে আলেমদের মতভেদ রয়েছে। বিশেষ করে সুন্নাহর প্রকার, প্রমাণের শক্তি এবং রহিতকরণের শর্তের কারণে তাঁদের সিদ্ধান্তে পার্থক্য দেখা যায়।</p><p><b>৩. হানাফি আলেমদের মতামত</b></p><p>হানাফি উসূলবিদদের মতে, কুরআনের বিধান রহিত করার জন্য এমন দলিল প্রয়োজন, যা প্রমাণের শক্তিতে সংশ্লিষ্ট বিধানের উপযুক্ত। এ কারণে মুতাওয়াতির সুন্নাহর সঙ্গে খবরে ওয়াহিদের পার্থক্য করা হয়।</p><p>মুতাওয়াতির সুন্নাহ হলো এমন বর্ণনা, যা প্রত্যেক স্তরে এত অধিকসংখ্যক বর্ণনাকারীর মাধ্যমে এসেছে যে তাঁদের সম্মিলিতভাবে মিথ্যার ওপর একমত হওয়া সাধারণত অসম্ভব বলে বিবেচিত হয়। আর খবরে ওয়াহিদ হলো এমন বর্ণনা, যা মুতাওয়াতির পর্যায়ে পৌঁছেনি।</p><p>হানাফি উসূলের আলোচনায় মুতাওয়াতির সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়ার সম্ভাবনা স্বীকার করা হয়; কিন্তু খবরে ওয়াহিদ দ্বারা কুরআনের বিধান রহিত করা গ্রহণযোগ্য নয়। কারণ, কুরআনের প্রমাণ প্রতিষ্ঠিত হওয়ার স্তর এবং খবরে ওয়াহিদের প্রমাণের স্তর এক নয়।</p><p><b>৪. কুরআনের বিধান রহিত করার ক্ষেত্রে সুন্নাহর প্রমাণমূল্য</b></p><p>রাসুলুল্লাহ (সা.)-এর সুন্নাহ শরিয়তের একটি স্বীকৃত দলিল। আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانْتَهُوا</div><div class=\"tr\">“রাসুল তোমাদের যা দেন, তা গ্রহণ করো এবং যা থেকে নিষেধ করেন, তা থেকে বিরত থাকো।”</div><div class=\"rf\">—সূরা আল-হাশর: ৭</div></div><p>এ আয়াত রাসুলুল্লাহ (সা.)-এর নির্দেশ মানার গুরুত্ব প্রমাণ করে। তবে এ আয়াত থেকে সরাসরি প্রমাণিত হয় না যে, যেকোনো ধরনের সুন্নাহ দ্বারা কুরআনের যেকোনো বিধান রহিত করা যায়। নাসখের ক্ষেত্রে সুন্নাহর প্রমাণের স্তর, সংশ্লিষ্ট দলিল এবং আলেমদের নির্ধারিত শর্ত বিবেচনা করতে হয়।</p><p><b>৫. ব্যাখ্যা ও নাসখের মধ্যে পার্থক্য</b></p><p>কুরআনের কোনো বিধানের ব্যাখ্যা দেওয়া এবং সেই বিধান রহিত করা এক বিষয় নয়। অনেক সময় সুন্নাহ কুরআনের কোনো বিধানের বিস্তারিত ব্যাখ্যা দেয়, তার শর্ত নির্ধারণ করে অথবা প্রয়োগের পদ্ধতি বুঝিয়ে দেয়। এগুলোকে নাসখ বলা যায় না।</p><p>যেমন, কুরআনে নামাজ প্রতিষ্ঠার নির্দেশ দেওয়া হয়েছে; রাসুলুল্লাহ (সা.) তাঁর কথা ও কাজের মাধ্যমে নামাজের রাকাত, পদ্ধতি ও বিভিন্ন বিধান ব্যাখ্যা করেছেন। এটি কুরআনের নির্দেশের ব্যাখ্যা, কুরআনের বিধান রহিত করা নয়।</p><p>অতএব, কোনো সুন্নাহ কুরআনের বক্তব্যকে ব্যাখ্যা করছে, নাকি পূর্ববর্তী বিধানকে রহিত করছে—তা নির্ধারণ করা অত্যন্ত গুরুত্বপূর্ণ।</p><p><b>৬. নাসখ প্রমাণের শর্ত</b></p><p>কোনো বিধানকে রহিত হয়েছে বলে দাবি করার ক্ষেত্রে কয়েকটি বিষয় বিবেচনা করা জরুরি।</p><p>প্রথমত, রহিতকারী দলিলটি নির্ভরযোগ্য হতে হবে।</p><p>দ্বিতীয়ত, রহিতকারী দলিলটি পূর্ববর্তী বিধানের পরে এসেছে—এ বিষয়টি প্রমাণিত হতে হবে।</p><p>তৃতীয়ত, উভয় দলিলের মধ্যে প্রকৃত বিরোধ থাকতে হবে, যা সমন্বয় বা ব্যাখ্যার মাধ্যমে দূর করা সম্ভব নয়।</p><p>চতুর্থত, শুধু বাহ্যিক পার্থক্য দেখেই নাসখের সিদ্ধান্ত দেওয়া যাবে না। কারণ, অনেক ক্ষেত্রে একটি দলিল অন্যটির ব্যাখ্যা প্রদান করে।</p><p>পঞ্চমত, নাসখের দাবি কুরআন ও সুন্নাহর নির্ভরযোগ্য বর্ণনা এবং উসূলুল ফিকহের স্বীকৃত নীতির ভিত্তিতে প্রতিষ্ঠিত হতে হবে।</p><p><b>৭. বিষয়টির সারকথা</b></p><p>সুন্নাহ দ্বারা কুরআন রহিত হওয়ার প্রশ্নে এককথায় সব আলেমের মত একই নয়। হানাফি উসূলবিদদের মতে, খবরে ওয়াহিদ দ্বারা কুরআন রহিত করা যায় না; মুতাওয়াতির সুন্নাহ দ্বারা রহিত হওয়ার বিষয়টি শর্তসাপেক্ষে আলোচিত হয়েছে। অন্যদিকে কিছু উসূলবিদ সহিহ সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়াকে নীতিগতভাবে সম্ভব বলে বিবেচনা করেন। তাই পরীক্ষার উত্তরে মতভেদটি উল্লেখ করে দলিলের শক্তি ও নাসখের শর্ত ব্যাখ্যা করাই যথাযথ।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, নাসখ হলো পরবর্তী শরয়ি দলিলের মাধ্যমে পূর্ববর্তী কোনো শরয়ি বিধানের কার্যকারিতা রহিত করা। কুরআন নিজেই নাসখের বৈধতা প্রমাণ করে। তবে সুন্নাহ দ্বারা কুরআনের বিধান রহিত হওয়া নিয়ে উসূলুল ফিকহের আলেমদের মধ্যে মতভেদ রয়েছে। হানাফি মত অনুযায়ী খবরে ওয়াহিদ দ্বারা কুরআন রহিত করা যায় না; মুতাওয়াতির সুন্নাহর ক্ষেত্রে শর্তসাপেক্ষ আলোচনা রয়েছে। সুতরাং, এ বিষয়ে সিদ্ধান্ত গ্রহণের সময় কুরআন-সুন্নাহর প্রমাণমূল্য, বর্ণনার নির্ভরযোগ্যতা এবং নাসখের স্বীকৃত শর্তসমূহ বিবেচনা করা অপরিহার্য।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">تحدث عن جمع القرآن فى عهد أبى بكر وعثمان رضى الله عنهما بالتفصيل</span>হযরত আবু বকর (রা.) ও উসমান (রা.)-এর যুগে কুরআন একত্রীকরণ সম্পর্কে বিস্তারিত আলোচনা কর।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআনুল কারীম মহান আল্লাহ তাআলার সর্বশেষ আসমানি কিতাব। রাসুলুল্লাহ (সা.)-এর যুগে কুরআন মুখস্থকরণ ও বিভিন্ন লেখার উপকরণে লিখে সংরক্ষণ করা হয়েছিল। তবে তখন কুরআনকে একটি মলাটের মধ্যে পূর্ণাঙ্গ গ্রন্থ হিসেবে একত্র করা হয়নি। রাসুলুল্লাহ (সা.)-এর ইন্তেকালের পর হযরত আবু বকর সিদ্দিক (রা.)-এর যুগে কুরআনের বিচ্ছিন্ন লিখিত অংশগুলো একত্রে সংকলন করা হয়। পরবর্তীকালে হযরত উসমান ইবনে আফফান (রা.)-এর যুগে মুসলিমদের মধ্যে কুরআন পাঠের বিরোধ দূর করার জন্য প্রামাণ্য মুসহাফের অনুলিপি প্রস্তুত করে বিভিন্ন অঞ্চলে পাঠানো হয়। এ দুটি উদ্যোগ কুরআন সংরক্ষণের ইতিহাসে অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">হযরত আবু বকর (রা.)-এর যুগে কুরআন সংকলন:</div><p><b>১. সংকলনের পটভূমি</b></p><p>রাসুলুল্লাহ (সা.)-এর ইন্তেকালের পর হযরত আবু বকর সিদ্দিক (রা.) প্রথম খলিফা হিসেবে দায়িত্ব গ্রহণ করেন। তাঁর খিলাফতকালে ইয়ামামার যুদ্ধে বহু কুরআন-হাফেজ শহিদ হন। এতে ভবিষ্যতে কুরআনের লিখিত অংশগুলো একত্রে সংরক্ষণের প্রয়োজনীয়তা আরও স্পষ্ট হয়ে ওঠে।</p><p>হযরত উমর ইবনে খাত্তাব (রা.) উপলব্ধি করেন যে, কুরআনকে একটি সংকলনে একত্র করা জরুরি। তিনি আবু বকর (রা.)-এর কাছে এ বিষয়ে প্রস্তাব পেশ করেন। প্রথমে আবু বকর (রা.) এমন কাজ করার ব্যাপারে দ্বিধা প্রকাশ করেন, যা রাসুলুল্লাহ (সা.)-এর জীবদ্দশায় এভাবে সম্পন্ন করা হয়নি। পরে তিনি এর গুরুত্ব উপলব্ধি করে প্রস্তাবে সম্মত হন।</p><p><b>২. যায়েদ ইবনে সাবিত (রা.)-কে দায়িত্ব প্রদান</b></p><p>হযরত আবু বকর (রা.) কুরআন সংকলনের গুরুদায়িত্ব হযরত যায়েদ ইবনে সাবিত (রা.)-এর ওপর অর্পণ করেন। তিনি ছিলেন রাসুলুল্লাহ (সা.)-এর অন্যতম প্রধান ওহিলেখক। তাঁর মেধা, স্মৃতিশক্তি, সতর্কতা ও বিশ্বস্ততার কারণে তাঁকে এ কাজের জন্য নির্বাচন করা হয়।</p><p>সহিহ বুখারিতে যায়েদ ইবনে সাবিত (রা.)-এর বর্ণনা অনুযায়ী, আবু বকর (রা.) তাঁকে ডেকে কুরআন সংগ্রহ ও সংকলনের দায়িত্ব দেন। যায়েদ (রা.) প্রথমে এ কাজের গুরুত্ব ও কঠিনতা উপলব্ধি করে দ্বিধা প্রকাশ করেন। পরে তিনি দায়িত্ব গ্রহণ করেন এবং অত্যন্ত সতর্কতার সঙ্গে কাজ শুরু করেন।</p><p><b>৩. কুরআনের আয়াত সংগ্রহের পদ্ধতি</b></p><p>হযরত যায়েদ ইবনে সাবিত (রা.) কুরআন সংকলনের সময় কেবল নিজের মুখস্থ জ্ঞানের ওপর নির্ভর করেননি। তিনি বিভিন্ন লিখিত উপকরণে সংরক্ষিত আয়াত সংগ্রহ করেন এবং সাহাবিদের মুখস্থ পাঠের সঙ্গে তা যাচাই করেন।</p><p>তৎকালীন সময়ে কুরআনের আয়াত চামড়া, খেজুরের ডাল, পাথরের পাতলা ফলক ও অন্যান্য উপকরণে লেখা ছিল। যায়েদ (রা.) এসব উপকরণ থেকে আয়াত সংগ্রহ করেন। তাঁর উদ্দেশ্য ছিল, কুরআনের প্রতিটি আয়াত যথাসম্ভব সতর্কতার সঙ্গে প্রামাণ্যভাবে সংকলন করা।</p><p><b>৪. সংকলনের সতর্কতা ও নির্ভরযোগ্যতা</b></p><p>হযরত যায়েদ (রা.) অত্যন্ত সতর্কতার সঙ্গে কুরআনের আয়াত সংগ্রহ ও যাচাই করেন। তিনি লিখিত উপকরণ এবং সাহাবিদের সংরক্ষিত পাঠের ভিত্তিতে সংকলনের কাজ সম্পন্ন করেন। এ পদ্ধতির মাধ্যমে কুরআনের লিখিত সংরক্ষণকে সুসংগঠিত করা হয়।</p><p>সহিহ বুখারিতে যায়েদ (রা.)-এর বর্ণনায় সূরা আত-তাওবার শেষাংশের একটি আয়াত খুঁজে পাওয়ার ঘটনা উল্লেখ রয়েছে। আয়াতটি আবু খুযাইমা আল-আনসারি (রা.)-এর কাছে লিখিত অবস্থায় পাওয়া যায়। এ ঘটনা সংকলনের সময় আয়াত সংগ্রহে সতর্কতা ও অনুসন্ধানের গুরুত্ব তুলে ধরে।</p><p><b>৫. সংকলিত কুরআনের সংরক্ষণ</b></p><p>হযরত আবু বকর (রা.)-এর নির্দেশে সংকলিত কুরআনের পাণ্ডুলিপি প্রথমে তাঁর কাছে সংরক্ষিত ছিল। তাঁর ইন্তেকালের পর তা হযরত উমর (রা.)-এর কাছে থাকে। উমর (রা.)-এর ইন্তেকালের পর তাঁর কন্যা এবং রাসুলুল্লাহ (সা.)-এর স্ত্রী হযরত হাফসা (রা.)-এর কাছে পাণ্ডুলিপিটি সংরক্ষিত হয়।</p><p>এই সংকলনের ফলে কুরআনের বিচ্ছিন্ন লিখিত অংশগুলো একত্রে একটি সংরক্ষিত পাণ্ডুলিপির রূপ লাভ করে। পরবর্তীকালে উসমান (রা.)-এর যুগে প্রামাণ্য মুসহাফের অনুলিপি প্রস্তুতের সময় এই পাণ্ডুলিপি গুরুত্বপূর্ণ ভিত্তি হিসেবে ব্যবহৃত হয়।</p><div class=\"h\">হযরত উসমান (রা.)-এর যুগে কুরআন সংকলন ও মুসহাফের অনুলিপি প্রস্তুত:</div><p><b>১. সংকলনের পটভূমি</b></p><p>হযরত উসমান ইবনে আফফান (রা.)-এর খিলাফতকালে ইসলামী সাম্রাজ্য বিস্তৃত হয়। বিভিন্ন অঞ্চলের মুসলমানরা কুরআন শিক্ষা ও তিলাওয়াত করতেন। তাঁদের মধ্যে কিছু পাঠভঙ্গি ও উচ্চারণের পার্থক্য নিয়ে মতবিরোধ দেখা দেয়। বিশেষত আর্মেনিয়া ও আজারবাইজানের অভিযানে অংশগ্রহণকারী মুসলিম সৈন্যদের মধ্যে কুরআন পাঠ নিয়ে মতভেদ লক্ষ্য করেন হযরত হুযাইফা ইবনুল ইয়ামান (রা.)।</p><p>তিনি মদিনায় ফিরে উসমান (রা.)-কে এ পরিস্থিতি সম্পর্কে অবহিত করেন এবং মুসলিম উম্মাহর মধ্যে কুরআন পাঠের ঐক্য প্রতিষ্ঠার উদ্যোগ নেওয়ার পরামর্শ দেন।</p><p><b>২. হাফসা (রা.)-এর কাছে সংরক্ষিত পাণ্ডুলিপি সংগ্রহ</b></p><p>হযরত উসমান (রা.) হযরত হাফসা (রা.)-এর কাছে সংরক্ষিত আবু বকর (রা.)-এর যুগের সংকলিত পাণ্ডুলিপি চেয়ে পাঠান। তাঁর উদ্দেশ্য ছিল, সেই পাণ্ডুলিপির ভিত্তিতে নির্ভরযোগ্য অনুলিপি তৈরি করা এবং মুসলিম বিশ্বের বিভিন্ন অঞ্চলে পাঠানো।</p><p>হাফসা (রা.) পাণ্ডুলিপিটি পাঠিয়ে দেন। উসমান (রা.) এরপর কুরআনের প্রামাণ্য অনুলিপি প্রস্তুতের জন্য একটি কমিটি গঠন করেন।</p><p><b>৩. মুসহাফ প্রস্তুতের কমিটি গঠন</b></p><p>হযরত উসমান (রা.) চারজন বিশিষ্ট সাহাবিকে নিয়ে একটি কমিটি গঠন করেন। তাঁরা হলেন—</p><p><b>১. যায়েদ ইবনে সাবিত (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">زيد بن ثابت</span></p><p><b>২. আবদুল্লাহ ইবনে যুবাইর (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">عبد الله بن الزبير</span></p><p><b>৩. সাঈদ ইবনে আস (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">سعيد بن العاص</span></p><p><b>৪. আবদুর রহমান ইবনে হারিস ইবনে হিশাম (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">عبد الرحمن بن الحارث بن هشام</span></p><p>এই কমিটির প্রধান দায়িত্ব ছিল সংরক্ষিত পাণ্ডুলিপির ভিত্তিতে প্রামাণ্য মুসহাফের অনুলিপি প্রস্তুত করা। প্রয়োজনীয় ক্ষেত্রে কুরাইশি ভাষারীতি অনুসরণ করার নির্দেশও তাঁদের দেওয়া হয়েছিল।</p><p><b>৪. প্রামাণ্য মুসহাফের অনুলিপি প্রস্তুত</b></p><p>কমিটি হযরত হাফসা (রা.)-এর কাছে সংরক্ষিত পাণ্ডুলিপির ভিত্তিতে কুরআনের একাধিক অনুলিপি প্রস্তুত করে। এ কাজের মাধ্যমে কুরআনের লিখিত পাঠের একটি প্রামাণ্য রূপ মুসলিম উম্মাহর জন্য নির্ধারিত হয়।</p><p>এখানে লক্ষণীয় যে, উসমান (রা.)-এর যুগের কাজটি আবু বকর (রা.)-এর যুগের সংকলনের পুনরাবৃত্তি ছিল না। আবু বকর (রা.)-এর যুগে কুরআনের বিচ্ছিন্ন লিখিত অংশ একত্র করা হয়েছিল; আর উসমান (রা.)-এর যুগে সংরক্ষিত পাণ্ডুলিপির ভিত্তিতে প্রামাণ্য অনুলিপি প্রস্তুত করে বিভিন্ন অঞ্চলে পাঠানো হয়েছিল।</p><p><b>৫. বিভিন্ন অঞ্চলে মুসহাফ পাঠানো</b></p><p>প্রামাণ্য অনুলিপি প্রস্তুত করার পর হযরত উসমান (রা.) সেগুলো মুসলিম বিশ্বের বিভিন্ন গুরুত্বপূর্ণ অঞ্চলে পাঠান। এর উদ্দেশ্য ছিল, কুরআনের লিখিত পাঠের ক্ষেত্রে ঐক্য প্রতিষ্ঠা করা এবং ব্যক্তিগত অনুলিপি থেকে উদ্ভূত বিভ্রান্তি দূর করা।</p><p>তিনি সরকারি উদ্যোগে প্রস্তুত করা মুসহাফের সঙ্গে সামঞ্জস্যহীন ব্যক্তিগত লিখিত কপিগুলো সরিয়ে দেওয়ার নির্দেশ দেন। এর মাধ্যমে মুসলিম উম্মাহর মধ্যে কুরআনের প্রামাণ্য লিখিত পাঠের ঐক্য সুদৃঢ় হয়।</p><p><b>৬. উসমানি মুসহাফের গুরুত্ব</b></p><p>উসমান (রা.)-এর উদ্যোগের ফলে মুসলিমদের মধ্যে কুরআনের লিখিত পাঠ নিয়ে বিরোধ কমে আসে। বিভিন্ন অঞ্চলে প্রামাণ্য মুসহাফ পাঠানো হওয়ায় কুরআন শিক্ষা ও তিলাওয়াতের ক্ষেত্রে একটি সাধারণ লিখিত ভিত্তি প্রতিষ্ঠিত হয়।</p><p>উসমানি মুসহাফের প্রাথমিক লিপিতে পরবর্তী সময়ের মতো পূর্ণাঙ্গ হরকত ও নুকতা ছিল না। পরবর্তী যুগে আরবি ভাষা ও কুরআন পাঠের সুবিধার জন্য এসব চিহ্ন সংযোজন করা হয়। তবে কুরআনের মূল পাঠ সংরক্ষণে উসমান (রা.)-এর উদ্যোগ ঐতিহাসিকভাবে অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">আবু বকর (রা.) ও উসমান (রা.)-এর যুগের সংকলনের পার্থক্য:</div><p><b>প্রথমত:</b> আবু বকর (রা.)-এর যুগে কুরআনের বিভিন্ন লিখিত অংশ একত্র করে একটি সংকলিত পাণ্ডুলিপি তৈরি করা হয়েছিল। উসমান (রা.)-এর যুগে সেই সংরক্ষিত পাণ্ডুলিপির ভিত্তিতে প্রামাণ্য অনুলিপি প্রস্তুত করা হয়।</p><p><b>দ্বিতীয়ত:</b> আবু বকর (রা.)-এর যুগের সংকলনের প্রধান কারণ ছিল ইয়ামামার যুদ্ধে বহু কুরআন-হাফেজ শহিদ হওয়ার পর কুরআনকে একত্রে সংরক্ষণের প্রয়োজনীয়তা। উসমান (রা.)-এর যুগের উদ্যোগের প্রধান কারণ ছিল বিভিন্ন অঞ্চলে কুরআন পাঠ নিয়ে মতবিরোধ দূর করা।</p><p><b>তৃতীয়ত:</b> আবু বকর (রা.)-এর যুগের পাণ্ডুলিপি হাফসা (রা.)-এর কাছে সংরক্ষিত ছিল। উসমান (রা.)-এর যুগে সেই পাণ্ডুলিপির ভিত্তিতে একাধিক প্রামাণ্য অনুলিপি প্রস্তুত করে বিভিন্ন অঞ্চলে পাঠানো হয়।</p><p><b>চতুর্থত:</b> আবু বকর (রা.)-এর যুগে কুরআনের লিখিত অংশ একত্র করা ছিল মূল কাজ। উসমান (রা.)-এর যুগে প্রামাণ্য মুসহাফের অনুলিপি তৈরি ও মুসলিম উম্মাহর লিখিত পাঠের ঐক্য প্রতিষ্ঠা ছিল মূল লক্ষ্য।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, হযরত আবু বকর সিদ্দিক (রা.) ও হযরত উসমান ইবনে আফফান (রা.)-এর যুগে কুরআন সংরক্ষণের দুটি গুরুত্বপূর্ণ ঐতিহাসিক উদ্যোগ গ্রহণ করা হয়। আবু বকর (রা.)-এর যুগে যায়েদ ইবনে সাবিত (রা.)-এর নেতৃত্বে কুরআনের বিচ্ছিন্ন লিখিত অংশ একত্র করে সংকলিত পাণ্ডুলিপি প্রস্তুত করা হয়। আর উসমান (রা.)-এর যুগে সেই পাণ্ডুলিপির ভিত্তিতে প্রামাণ্য মুসহাফের অনুলিপি তৈরি করে বিভিন্ন অঞ্চলে পাঠানো হয়। প্রথম উদ্যোগ কুরআনের লিখিত অংশগুলোকে একত্রে সংরক্ষণ করে এবং দ্বিতীয় উদ্যোগ মুসলিম উম্মাহর মধ্যে কুরআনের প্রামাণ্য লিখিত পাঠের ঐক্য প্রতিষ্ঠায় গুরুত্বপূর্ণ ভূমিকা পালন করে। এ দুই খলিফার অবদান কুরআন সংরক্ষণের ইতিহাসে চিরস্মরণীয়।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">اكتب اسماء عشرة من كتبة الوحى - ثم بين نبذة من ترجمة زيد بن ثابت رضى الله عنه مع ذكر مساهمته المتميزة فيه</span>দশজন ওহীলেখক সাহাবির নাম লেখ এবং হযরত যায়েদ ইবনে সাবিত (রা.)-এর জীবনী ও ওহি লেখার ক্ষেত্রে তাঁর অনন্য অবদান বর্ণনা কর।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআনুল কারীম মহান আল্লাহ তাআলার পক্ষ থেকে অবতীর্ণ সর্বশেষ আসমানি কিতাব। রাসুলুল্লাহ (সা.)-এর যুগে কুরআন সংরক্ষণের জন্য সাহাবায়ে কেরাম মুখস্থকরণ ও লিখন—উভয় পদ্ধতি অনুসরণ করেন। যেসব সাহাবি রাসুলুল্লাহ (সা.)-এর নির্দেশে কুরআনের আয়াত লিখে রাখতেন, তাঁদের ওহিলেখক বা <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">كُتَّابُ الْوَحْيِ</span> বলা হয়। তাঁদের মধ্যে হযরত যায়েদ ইবনে সাবিত (রা.) বিশেষ মর্যাদার অধিকারী ছিলেন। কুরআন লিখন, সংকলন ও সংরক্ষণে তাঁর অবদান ইসলামের ইতিহাসে অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">দশজন ওহিলেখক সাহাবির নাম:</div><p>রাসুলুল্লাহ (সা.)-এর যুগে ওহি লিখন ও বিভিন্ন দাপ্তরিক কাজে একাধিক সাহাবি অংশগ্রহণ করেন। তাঁদের মধ্যে প্রসিদ্ধ দশজন হলেন—</p><p><b>১. হযরত যায়েদ ইবনে সাবিত (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">زيد بن ثابت</span></p><p><b>২. হযরত উবাই ইবনে কাব (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">أُبَيُّ بْنُ كَعْبٍ</span></p><p><b>৩. হযরত আলী ইবনে আবি তালিব (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">عَلِيُّ بْنُ أَبِي طَالِبٍ</span></p><p><b>৪. হযরত উসমান ইবনে আফফান (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">عُثْمَانُ بْنُ عَفَّانٍ</span></p><p><b>৫. হযরত আবু বকর সিদ্দিক (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">أَبُو بَكْرٍ الصِّدِّيقُ</span></p><p><b>৬. হযরত উমর ইবনে খাত্তাব (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">عُمَرُ بْنُ الْخَطَّابِ</span></p><p><b>৭. হযরত আবু সুফিয়ান ইবনে হারব (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">أَبُو سُفْيَانَ بْنُ حَرْبٍ</span></p><p><b>৮. হযরত মুয়াবিয়া ইবনে আবি সুফিয়ান (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">مُعَاوِيَةُ بْنُ أَبِي سُفْيَانَ</span></p><p><b>৯. হযরত খালিদ ইবনে সাঈদ ইবনে আস (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">خَالِدُ بْنُ سَعِيدِ بْنِ الْعَاصِ</span></p><p><b>১০. হযরত আবদুল্লাহ ইবনে সা‘দ ইবনে আবি সারহ (রা.)</b> — <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">عَبْدُ اللَّهِ بْنُ سَعْدِ بْنِ أَبِي سَرْحٍ</span></p><p>উল্লেখ্য, প্রাচীন ঐতিহাসিক গ্রন্থগুলোতে ওহিলেখকদের তালিকা ও তাঁদের দায়িত্বের বিবরণে কিছু পার্থক্য রয়েছে। তাঁদের কেউ নিয়মিত কুরআনের ওহি লিখতেন, আবার কেউ কখনো কখনো ওহি, চিঠিপত্র, চুক্তিনামা ও অন্যান্য দাপ্তরিক বিষয় লিখতেন।</p><div class=\"h\">হযরত যায়েদ ইবনে সাবিত (রা.)-এর জীবনী:</div><p><b>নাম ও পরিচয়</b></p><p>তাঁর পূর্ণ নাম যায়েদ ইবনে সাবিত ইবনে আদ-দাহহাক আল-আনসারি (রা.)। তিনি মদিনার আনসার সাহাবিদের অন্তর্ভুক্ত ছিলেন। তাঁর গোত্র ছিল খাজরাজ। তিনি অল্প বয়স থেকেই জ্ঞান, মেধা ও স্মৃতিশক্তির জন্য পরিচিত ছিলেন।</p><p><b>জন্ম ও শৈশব</b></p><p>হযরত যায়েদ ইবনে সাবিত (রা.) হিজরতের কয়েক বছর আগে মদিনায় জন্মগ্রহণ করেন বলে ঐতিহাসিক সূত্রে উল্লেখ রয়েছে। অল্প বয়সেই তিনি ইসলাম গ্রহণ করেন। বদর যুদ্ধে অংশগ্রহণের জন্য তিনি রাসুলুল্লাহ (সা.)-এর কাছে উপস্থিত হলেও বয়স কম হওয়ায় তাঁকে যুদ্ধে অংশগ্রহণের অনুমতি দেওয়া হয়নি। পরবর্তী সময়ে তিনি ইসলামের বিভিন্ন গুরুত্বপূর্ণ কাজে অংশ নেন।</p><p><b>জ্ঞান ও মেধা</b></p><p>হযরত যায়েদ (রা.) ছিলেন অত্যন্ত মেধাবী ও জ্ঞানপিপাসু সাহাবি। তিনি কুরআন শিক্ষা গ্রহণের পাশাপাশি লেখাপড়া ও ভাষা শেখার ক্ষেত্রেও বিশেষ দক্ষতা অর্জন করেন। রাসুলুল্লাহ (সা.) তাঁকে ইহুদিদের ভাষা শেখার নির্দেশ দিয়েছিলেন বলে বর্ণিত হয়েছে। তিনি অল্প সময়ের মধ্যে তা শিখে নেন এবং রাসুলুল্লাহ (সা.)-এর চিঠিপত্র পড়া ও লেখার কাজে সহায়তা করেন।</p><p>এ থেকে তাঁর প্রখর স্মৃতিশক্তি, ভাষাগত দক্ষতা এবং দায়িত্ব পালনের যোগ্যতা প্রকাশ পায়।</p><p><b>ওহি লেখক হিসেবে দায়িত্ব</b></p><p>হযরত যায়েদ ইবনে সাবিত (রা.) রাসুলুল্লাহ (সা.)-এর অন্যতম প্রধান ওহিলেখক ছিলেন। কুরআনের আয়াত নাযিল হলে তিনি রাসুলুল্লাহ (সা.)-এর নির্দেশে তা লিখে রাখতেন। এ কাজের জন্য তাঁর ওপর বিশেষ আস্থা রাখা হতো।</p><p>তিনি কুরআনের আয়াত লিখে রাখার পাশাপাশি রাসুলুল্লাহ (সা.)-এর নির্দেশ অনুযায়ী আয়াতের অবস্থান ও বিন্যাস সম্পর্কেও নির্দেশনা গ্রহণ করতেন। তাঁর এই দায়িত্ব কুরআনের লিখিত সংরক্ষণে গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><div class=\"h\">কুরআন সংকলনে হযরত যায়েদ (রা.)-এর অনন্য অবদান:</div><p><b>১. আবু বকর (রা.)-এর যুগে কুরআন সংকলনের দায়িত্ব</b></p><p>রাসুলুল্লাহ (সা.)-এর ইন্তেকালের পর আবু বকর সিদ্দিক (রা.)-এর খিলাফতকালে ইয়ামামার যুদ্ধে বহু কুরআন-হাফেজ শহিদ হন। তখন উমর ইবনে খাত্তাব (রা.) কুরআনকে একত্রে সংকলনের প্রস্তাব দেন। আবু বকর (রা.) প্রথমে বিষয়টি নিয়ে চিন্তিত হলেও পরে এর গুরুত্ব উপলব্ধি করে সম্মত হন।</p><p>এরপর আবু বকর (রা.) হযরত যায়েদ ইবনে সাবিত (রা.)-কে কুরআন সংকলনের দায়িত্ব দেন। যায়েদ (রা.) প্রথমে এই গুরুদায়িত্ব গ্রহণ করতে দ্বিধা প্রকাশ করেন; কারণ, রাসুলুল্লাহ (সা.)-এর জীবদ্দশায় এভাবে এক মলাটে কুরআন সংকলন করা হয়নি। পরে তিনি কাজটির গুরুত্ব বুঝতে পেরে দায়িত্ব গ্রহণ করেন।</p><p><b>২. অত্যন্ত সতর্কতার সঙ্গে আয়াত সংগ্রহ</b></p><p>হযরত যায়েদ (রা.) কুরআন সংকলনের কাজে অত্যন্ত সতর্কতা অবলম্বন করেন। তিনি শুধু নিজের মুখস্থ জ্ঞানের ওপর নির্ভর করেননি; বরং লিখিত উপকরণ এবং সাহাবিদের সংরক্ষিত পাঠের ভিত্তিতে আয়াত সংগ্রহ করেন। তাঁর লক্ষ্য ছিল কুরআনের প্রতিটি আয়াত যথাযথভাবে সংরক্ষণ করা।</p><p>সহিহ বুখারিতে যায়েদ ইবনে সাবিত (রা.)-এর বর্ণনা থেকে জানা যায়, তিনি চামড়া, খেজুরের ডাল, পাথরের ফলক এবং মানুষের বক্ষস্থলে সংরক্ষিত কুরআনের অংশ সংগ্রহ করে সংকলনের কাজ সম্পন্ন করেন। (সহিহ আল-বুখারি, হাদিস: ৪৯৮৬)</p><p><b>৩. কুরআনের লিখিত অংশ একত্র করা</b></p><p>রাসুলুল্লাহ (সা.)-এর যুগে কুরআনের বিভিন্ন অংশ পৃথক পৃথক লেখার উপকরণে সংরক্ষিত ছিল। হযরত যায়েদ (রা.) এসব লিখিত অংশ সংগ্রহ করে একটি সুসংগঠিত সংকলন প্রস্তুত করেন। এভাবে কুরআনের বিচ্ছিন্ন লিখিত অংশগুলো একত্রে সংরক্ষিত হয়।</p><p>এটি ছিল কুরআনের ইতিহাসে একটি যুগান্তকারী পদক্ষেপ। তাঁর সতর্কতা ও পরিশ্রমের কারণে কুরআনের লিখিত সংকলন একটি সুসংগঠিত রূপ লাভ করে।</p><p><b>৪. উসমান (রা.)-এর যুগে মুসহাফ প্রস্তুতিতে অবদান</b></p><p>উসমান ইবনে আফফান (রা.)-এর খিলাফতকালে ইসলামী সাম্রাজ্য বিস্তৃত হওয়ার সঙ্গে সঙ্গে বিভিন্ন অঞ্চলের মুসলমানদের মধ্যে কুরআন পাঠের পদ্ধতি নিয়ে মতভেদ দেখা দেয়। তখন উসমান (রা.) প্রামাণ্য মুসহাফ প্রস্তুত করে বিভিন্ন অঞ্চলে পাঠানোর উদ্যোগ নেন।</p><p>এই কাজে তিনি হযরত যায়েদ ইবনে সাবিত (রা.)-সহ কয়েকজন সাহাবিকে দায়িত্ব দেন। আবু বকর (রা.)-এর যুগে সংকলিত কুরআনের পাণ্ডুলিপিকে ভিত্তি করে মুসহাফের অনুলিপি প্রস্তুত করা হয়। ফলে মুসলিম উম্মাহর মধ্যে কুরআনের লিখিত পাঠের ঐক্য প্রতিষ্ঠায় গুরুত্বপূর্ণ অগ্রগতি ঘটে।</p><p><b>৫. কুরআন সংরক্ষণে নির্ভরযোগ্যতা ও সতর্কতার দৃষ্টান্ত</b></p><p>হযরত যায়েদ (রা.)-এর কাজের অন্যতম বৈশিষ্ট্য ছিল তাঁর সতর্কতা, আমানতদারি এবং দায়িত্বশীলতা। তিনি কুরআন সংকলনের মতো গুরুদায়িত্ব পালন করতে গিয়ে ব্যক্তিগত অনুমান বা অসতর্কতার আশ্রয় নেননি। বরং প্রাপ্ত লিখিত উপকরণ ও সংরক্ষিত পাঠ যাচাই করে কাজ সম্পন্ন করেন।</p><p>এ কারণে কুরআনের সংকলন-ইতিহাসে তাঁর নাম বিশেষ মর্যাদার সঙ্গে স্মরণ করা হয়।</p><div class=\"h\">ইন্তেকাল:</div><p>হযরত যায়েদ ইবনে সাবিত (রা.)-এর ইন্তেকালের সাল সম্পর্কে ঐতিহাসিক বর্ণনায় কিছু মতপার্থক্য রয়েছে। প্রসিদ্ধ মত অনুযায়ী, তিনি হিজরি ৪৫ সালের দিকে মদিনায় ইন্তেকাল করেন। তিনি ইসলামের জ্ঞানচর্চা, কুরআন শিক্ষা এবং মুসলিম সমাজের বিভিন্ন গুরুত্বপূর্ণ কাজে অসামান্য অবদান রেখে গেছেন।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, হযরত যায়েদ ইবনে সাবিত (রা.) ছিলেন রাসুলুল্লাহ (সা.)-এর অন্যতম প্রধান ওহিলেখক এবং কুরআন সংরক্ষণের ইতিহাসে একজন গুরুত্বপূর্ণ ব্যক্তিত্ব। তাঁর মেধা, স্মৃতিশক্তি, সতর্কতা ও আমানতদারির কারণে আবু বকর (রা.)-এর যুগে কুরআন সংকলন এবং উসমান (রা.)-এর যুগে প্রামাণ্য মুসহাফ প্রস্তুতের কাজ বিশেষভাবে উপকৃত হয়। তাঁর অবদান মুসলিম উম্মাহর জন্য এক অমূল্য ঐতিহাসিক সম্পদ।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">ما المراد بآخر ما نزل من القرآن الكريم؟ وما اختلاف العلماء فيه؟ بين مفصلا</span>আখিরু মা নাযালা মিনাল কুরআনিল কারীম দ্বারা উদ্দেশ্য কী? এ বিষয়ে আলেমগণের মতামত কী? বিস্তারিত বর্ণনা কর।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআনুল কারীম মহান আল্লাহ তাআলার সর্বশেষ আসমানি কিতাব, যা প্রায় তেইশ বছর ধরে বিভিন্ন সময়ে ও বিভিন্ন পরিস্থিতিতে রাসুলুল্লাহ (সা.)-এর ওপর অবতীর্ণ হয়েছে। কুরআনের কিছু আয়াত প্রথম দিকে এবং কিছু আয়াত রাসুলুল্লাহ (সা.)-এর জীবনের শেষ দিকে নাযিল হয়েছে। কুরআনের সর্বশেষ অবতীর্ণ আয়াত বা সূরা কোনটি—এ বিষয়ে সাহাবায়ে কেরাম ও পরবর্তী আলেমগণের মধ্যে একাধিক মত পাওয়া যায়। এ বিষয়টি উলূমুল কুরআনের গুরুত্বপূর্ণ আলোচনার অন্তর্ভুক্ত।</p><div class=\"h\">আখিরু মা নাযালা মিনাল কুরআনের পরিচয়:</div><p><b>আভিধানিক অর্থ</b></p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">آخر ما نزل من القرآن الكريم</span> শব্দটির অর্থ হলো—পবিত্র কুরআনের সর্বশেষ যা অবতীর্ণ হয়েছে।</p><p>এখানে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">آخر</span> অর্থ সর্বশেষ, <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">ما</span> অর্থ যা এবং <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">نزل</span> অর্থ অবতীর্ণ হয়েছে। সুতরাং, এর পূর্ণ অর্থ হলো কুরআনের সর্বশেষ অবতীর্ণ আয়াত বা সূরা।</p><p><b>পারিভাষিক অর্থ</b></p><p>উলূমুল কুরআনের পরিভাষায়, রাসুলুল্লাহ (সা.)-এর ওপর ওহি অবতরণের ধারাবাহিকতায় সর্বশেষ যে আয়াত বা সূরা নাযিল হয়েছে, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.2em\">آخر ما نزل من القرآن الكريم</span> বলা হয়।</p><p>তবে এ বিষয়ে মতভেদের কারণ হলো—কোনো সাহাবি রাসুলুল্লাহ (সা.)-এর জীবনের শেষ দিকে কোনো আয়াত নাযিল হতে দেখেছেন, আবার অন্য সাহাবি অন্য কোনো আয়াতকে সর্বশেষ বলে বর্ণনা করেছেন। অনেক ক্ষেত্রে তাঁরা নিজ নিজ জানা অনুযায়ী বক্তব্য দিয়েছেন। ফলে আলেমগণ বিভিন্ন বর্ণনা পর্যালোচনা করে এ বিষয়ে একাধিক মত উল্লেখ করেছেন।</p><div class=\"h\">কুরআনের সর্বশেষ অবতীর্ণ আয়াত সম্পর্কে আলেমগণের মতামত:</div><p><b>১. সূরা আল-বাকারার ২৮১ নম্বর আয়াত সর্বশেষ নাযিল হয়েছে</b></p><p>অনেক আলেমের মতে, সূরা আল-বাকারার ২৮১ নম্বর আয়াত কুরআনের সর্বশেষ অবতীর্ণ আয়াত। আয়াতটি হলো—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ</div><div class=\"tr\">“তোমরা সেই দিনকে ভয় করো, যেদিন তোমাদের আল্লাহর কাছে ফিরিয়ে নেওয়া হবে। অতঃপর প্রত্যেক ব্যক্তিকে তার উপার্জিত কর্মের পূর্ণ প্রতিদান দেওয়া হবে এবং তাদের প্রতি কোনো জুলুম করা হবে না।”</div><div class=\"rf\">—সূরা আল-বাকারা: ২৮১</div></div><p>ইবন আব্বাস (রা.) থেকে বর্ণিত হয়েছে যে, এ আয়াতটি কুরআনের সর্বশেষ অবতীর্ণ আয়াতগুলোর অন্যতম। কিছু বর্ণনায় একে সর্বশেষ আয়াত হিসেবে উল্লেখ করা হয়েছে। এ মতের সমর্থকেরা বলেন, আয়াতটি রাসুলুল্লাহ (সা.)-এর ইন্তেকালের অল্প কিছুদিন আগে নাযিল হয়েছিল।</p><p><b>২. সুদের আয়াত সর্বশেষ নাযিল হয়েছে</b></p><p>কিছু সাহাবি ও আলেমের বর্ণনা অনুযায়ী, সুদসংক্রান্ত আয়াতগুলো কুরআনের সর্বশেষ অবতীর্ণ আয়াতের অন্তর্ভুক্ত। বিশেষত সূরা আল-বাকারার ২৭৮ নম্বর আয়াত উল্লেখ করা হয়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَذَرُوا مَا بَقِيَ مِنَ الرِّبَا إِنْ كُنْتُمْ مُؤْمِنِينَ</div><div class=\"tr\">“হে মুমিনগণ! তোমরা আল্লাহকে ভয় করো এবং সুদের যা অবশিষ্ট রয়েছে, তা ছেড়ে দাও, যদি তোমরা মুমিন হয়ে থাকো।”</div><div class=\"rf\">—সূরা আল-বাকারা: ২৭৮</div></div><p>হযরত ইবন আব্বাস (রা.) থেকে সুদসংক্রান্ত আয়াতকে সর্বশেষ নাযিল হওয়া আয়াতের অন্তর্ভুক্ত বলে বর্ণনা পাওয়া যায়। এ মতের ভিত্তিতে আলেমগণ বলেন, সুদ নিষিদ্ধ করার বিধান রাসুলুল্লাহ (সা.)-এর জীবনের শেষ পর্যায়ে অবতীর্ণ হয়েছিল।</p><p><b>৩. সূরা আল-মায়িদার ৩ নম্বর আয়াতের অংশ সর্বশেষ নাযিল হয়েছে</b></p><p>কিছু আলেমের মতে, সূরা আল-মায়িদার ৩ নম্বর আয়াতের এই অংশটি সর্বশেষ নাযিল হয়েছে—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا</div><div class=\"tr\">“আজ আমি তোমাদের জন্য তোমাদের দ্বীনকে পূর্ণাঙ্গ করলাম, তোমাদের প্রতি আমার নিয়ামত সম্পূর্ণ করলাম এবং ইসলামকে তোমাদের দ্বীন হিসেবে মনোনীত করলাম।”</div><div class=\"rf\">—সূরা আল-মায়িদা: ৩</div></div><p>এ আয়াতটি বিদায় হজের সময় আরাফার দিনে নাযিল হয়েছিল বলে সহিহ বুখারি ও সহিহ মুসলিমে বর্ণিত হয়েছে। এ কারণে কিছু সাহাবি একে সর্বশেষ নাযিল হওয়া আয়াত বলে উল্লেখ করেছেন।</p><p>তবে অনেক আলেম ব্যাখ্যা করেছেন যে, এখানে দ্বীন পূর্ণাঙ্গ হওয়ার ঘোষণা দেওয়া হয়েছে; এটি আবশ্যিকভাবে কুরআনের একেবারে সর্বশেষ নাযিল হওয়া আয়াত—এ কথা প্রমাণ করে না। কারণ, এর পরেও কিছু আয়াত নাযিল হওয়ার বর্ণনা রয়েছে।</p><p><b>৪. কালালাহ-সংক্রান্ত আয়াত সর্বশেষ নাযিল হয়েছে</b></p><p>কিছু বর্ণনায় সূরা আন-নিসার ১৭৬ নম্বর আয়াতকে সর্বশেষ নাযিল হওয়া আয়াত বলা হয়েছে। এ আয়াতে কালালাহ বা এমন মৃত ব্যক্তির উত্তরাধিকারসংক্রান্ত বিধান বর্ণিত হয়েছে, যার সন্তান নেই এবং নির্দিষ্ট পরিস্থিতিতে পিতা-সম্পর্কিত উত্তরাধিকারীর বিষয়টি আলোচিত হয়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ</div><div class=\"tr\">“তারা তোমার কাছে ফতোয়া জানতে চায়। বলো, আল্লাহ তোমাদের কালালাহ সম্পর্কে বিধান জানাচ্ছেন।”</div><div class=\"rf\">—সূরা আন-নিসা: ১৭৬ (অংশ)</div></div><p>হযরত বারা ইবনে আযিব (রা.)-এর বর্ণনায় এ আয়াতকে কুরআনের সর্বশেষ নাযিল হওয়া আয়াতগুলোর একটি হিসেবে উল্লেখ করা হয়েছে। এ কারণে কিছু আলেম এ মত গ্রহণ করেছেন।</p><p><b>৫. সূরা আত-তাওবার ১২৮–১২৯ নম্বর আয়াত সর্বশেষ নাযিল হয়েছে</b></p><p>কিছু বর্ণনায় সূরা আত-তাওবার শেষের আয়াতগুলোকে সর্বশেষ নাযিল হওয়া আয়াত বলা হয়েছে। বিশেষ করে রাসুলুল্লাহ (সা.)-এর প্রতি মুমিনদের প্রতি তাঁর স্নেহ, দয়া ও কল্যাণকামিতার বিষয়টি এ আয়াতগুলোতে তুলে ধরা হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ</div><div class=\"tr\">“নিশ্চয়ই তোমাদের কাছে তোমাদের মধ্য থেকেই একজন রাসুল এসেছেন। তোমাদের কষ্ট তাঁর কাছে অত্যন্ত কষ্টদায়ক; তিনি তোমাদের কল্যাণের ব্যাপারে অত্যন্ত আগ্রহী, আর মুমিনদের প্রতি স্নেহশীল ও পরম দয়ালু।”</div><div class=\"rf\">—সূরা আত-তাওবা: ১২৮</div></div><p>তবে এ মতের বর্ণনাগুলোর গ্রহণযোগ্যতা ও ব্যাখ্যা নিয়ে আলেমদের আলোচনা রয়েছে। তাই এটিকে সর্বসম্মত মত হিসেবে উল্লেখ করা যায় না।</p><p><b>৬. সূরা আন-নাসর সর্বশেষ পূর্ণাঙ্গ সূরা</b></p><p>কিছু আলেমের মতে, সূরা আন-নাসর কুরআনের সর্বশেষ পূর্ণাঙ্গ সূরা, যা একত্রে নাযিল হয়েছিল। সূরাটি হলো—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ ۝ وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا</div><div class=\"tr\">“যখন আল্লাহর সাহায্য ও বিজয় আসবে এবং তুমি মানুষকে দলে দলে আল্লাহর দ্বীনে প্রবেশ করতে দেখবে, তখন তোমার রবের প্রশংসাসহ তাঁর পবিত্রতা ঘোষণা করো এবং তাঁর কাছে ক্ষমা প্রার্থনা করো। নিশ্চয়ই তিনি তাওবা কবুলকারী।”</div><div class=\"rf\">—সূরা আন-নাসর: ১–৩</div></div><p>হযরত ইবন আব্বাস (রা.)-এর বর্ণনা অনুযায়ী, এ সূরাটি রাসুলুল্লাহ (সা.)-কে তাঁর জীবনের সমাপ্তি ঘনিয়ে আসার ইঙ্গিত দিয়েছিল। তবে সর্বশেষ পূর্ণাঙ্গ সূরা হওয়া এবং সর্বশেষ আয়াত হওয়া এক বিষয় নয়।</p><div class=\"h\">আলেমগণের মতভেদের কারণ:</div><p>কুরআনের সর্বশেষ নাযিল হওয়া আয়াত সম্পর্কে মতভেদের কয়েকটি কারণ রয়েছে।</p><p><b>১. বিভিন্ন সাহাবির কাছে বিভিন্ন তথ্য পৌঁছানো:</b> সব সাহাবি সব সময় ওহি নাযিলের প্রতিটি ঘটনা প্রত্যক্ষ করেননি। তাই প্রত্যেকে নিজের জানা তথ্য অনুযায়ী বর্ণনা করেছেন।</p><p><b>২. সর্বশেষ বিধান ও সর্বশেষ আয়াতের পার্থক্য:</b> কোনো সাহাবি হয়তো সর্বশেষ বিধানসংক্রান্ত আয়াতকে সর্বশেষ বলেছেন, যদিও তার পরে অন্য বিষয়ের আয়াত নাযিল হয়েছিল।</p><p><b>৩. সর্বশেষ পূর্ণাঙ্গ সূরা ও সর্বশেষ আয়াতের পার্থক্য:</b> সূরা আন-নাসরকে সর্বশেষ পূর্ণাঙ্গ সূরা বলা হলেও তা কুরআনের সর্বশেষ একক আয়াত হওয়ার দাবি নয়।</p><p><b>৪. একাধিক আয়াতের কাছাকাছি সময়ে অবতরণ:</b> রাসুলুল্লাহ (সা.)-এর জীবনের শেষ পর্যায়ে একাধিক আয়াত নাযিল হওয়ায় কোনো কোনো বর্ণনায় বিভিন্ন আয়াতকে সর্বশেষ বলা হয়েছে।</p><p><b>৫. বর্ণনার ভাষা ও উদ্দেশ্যের পার্থক্য:</b> কোনো বর্ণনায় সর্বশেষ নাযিল হওয়া আয়াতের কথা বলা হয়েছে, আবার কোনো বর্ণনায় সর্বশেষ নাযিল হওয়া বিধান বা পূর্ণাঙ্গ সূরার কথা বলা হয়েছে। এ পার্থক্য না বুঝলে মতভেদ আরও জটিল মনে হয়।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, কুরআনের সর্বশেষ অবতীর্ণ আয়াত সম্পর্কে আলেমগণের মধ্যে একাধিক মত রয়েছে। সূরা আল-বাকারার ২৮১ নম্বর আয়াত, সুদসংক্রান্ত আয়াত, সূরা আল-মায়িদার ৩ নম্বর আয়াতের অংশ এবং সূরা আন-নিসার ১৭৬ নম্বর আয়াত—এসবকে বিভিন্ন বর্ণনায় সর্বশেষ নাযিল হওয়া আয়াতের অন্তর্ভুক্ত বলা হয়েছে। অন্যদিকে সূরা আন-নাসরকে সর্বশেষ পূর্ণাঙ্গ সূরা হিসেবে উল্লেখ করা হয়। এসব মতের মধ্যে সমন্বয় করতে হলে সর্বশেষ আয়াত, সর্বশেষ বিধান এবং সর্বশেষ পূর্ণাঙ্গ সূরার পার্থক্য বুঝতে হবে। তাই এ বিষয়ে কোনো একটি মতকে নিঃশর্তভাবে সর্বসম্মত বলা সঠিক নয়।</p>"]]}],'ছোট প্রশ্ন':[{n:'উলূমুল কুরআন ও তাফসির',c:s.c,q:[["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">أَوْضِحْ مَعْنَى التَّفْسِيرِ وَالتَّأْوِيلِ وَالْفُرُوقَ بَيْنَهُمَا.</span>তাফসির ও তা'বিলের অর্থ ব্যাখ্যা করো এবং এ দুটির মধ্যে পার্থক্য তুলে ধরো।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র আল-কুরআন মহান আল্লাহ তাআলার পক্ষ থেকে অবতীর্ণ মানবজাতির হিদায়াতের গ্রন্থ। কুরআনের আয়াতসমূহের সঠিক অর্থ ও মর্ম অনুধাবনের জন্য তাফসির ও তা’বিল গুরুত্বপূর্ণ দুটি পরিভাষা। এদের মধ্যে কিছু সাদৃশ্য থাকলেও অর্থ ও ব্যবহারের ক্ষেত্রে পার্থক্য রয়েছে।</p><div class=\"h\">তাফসিরের অর্থ (معنى التفسير):</div><p><b>আভিধানিক অর্থ:</b> তাফসির শব্দের অর্থ প্রকাশ করা, ব্যাখ্যা করা এবং অস্পষ্ট বিষয় স্পষ্ট করা।</p><p><b>পারিভাষিক অর্থ:</b> কুরআনের আয়াতসমূহের অর্থ, উদ্দেশ্য, শানে নুযুল, শব্দের ব্যাখ্যা এবং সংশ্লিষ্ট বিধান নির্ভরযোগ্য জ্ঞানের আলোকে আলোচনা করাকে তাফসির বলে।</p><div class=\"h\">তা’বিলের অর্থ (معنى التأويل):</div><p><b>আভিধানিক অর্থ:</b> তা’বিল শব্দের অর্থ কোনো বিষয়ের মূল অবস্থায় ফিরে যাওয়া, পরিণতি নির্ধারণ করা অথবা কোনো কথার উদ্দেশ্য ব্যাখ্যা করা।</p><p><b>পারিভাষিক অর্থ:</b> কোনো আয়াতের একাধিক সম্ভাব্য অর্থের মধ্য থেকে ভাষাগত নিয়ম ও গ্রহণযোগ্য প্রমাণের ভিত্তিতে উপযুক্ত অর্থ নির্ধারণ করাকে তা’বিল বলে। তবে এ সংজ্ঞা সম্পর্কে আলেমদের মধ্যে মতভেদ রয়েছে। অনেক আলেম তাফসির ও তা’বিলকে একই অর্থে ব্যবহার করেছেন।</p><div class=\"h\">তাফসির ও তা’বিলের পার্থক্য:</div><p><b>১. অর্থের দিক থেকে পার্থক্য</b></p><p>তাফসির হলো কোনো বক্তব্যের অর্থ স্পষ্টভাবে ব্যাখ্যা করা। অন্যদিকে, তা’বিল হলো কোনো বক্তব্যের সম্ভাব্য অর্থগুলোর মধ্য থেকে প্রমাণসমর্থিত অর্থ নির্ধারণ করা। তবে এ পার্থক্য সব আলেমের কাছে একইভাবে স্বীকৃত নয়।</p><p><b>২. ব্যাখ্যার পদ্ধতির দিক থেকে পার্থক্য</b></p><p>তাফসিরে আয়াতের শব্দার্থ, শানে নুযুল এবং প্রকাশ্য অর্থ ব্যাখ্যা করা হয়। অন্যদিকে, তা’বিলে ভাষাগত নিয়ম ও গ্রহণযোগ্য প্রমাণের আলোকে সম্ভাব্য অর্থের মধ্যে উপযুক্ত অর্থ নির্ধারণ করা হয়।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا يَأْتُونَكَ بِمَثَلٍ إِلَّا جِئْنَاكَ بِالْحَقِّ وَأَحْسَنَ تَفْسِيرًا</div><div class=\"tr\">“তারা তোমার কাছে এমন কোনো দৃষ্টান্ত নিয়ে আসে না, যার সঠিক সমাধান ও উত্তম ব্যাখ্যা আমি তোমার কাছে উপস্থিত করি।”</div><div class=\"rf\">—সূরা আল-ফুরকান: ৩৩</div></div><p><b>৩. প্রকাশ্য অর্থের দিক থেকে পার্থক্য</b></p><p>তাফসির সাধারণত আয়াতের প্রকাশ্য ও স্পষ্ট অর্থ ব্যাখ্যা করে। তা’বিল অনেক ক্ষেত্রে একাধিক সম্ভাব্য অর্থের মধ্য থেকে গ্রহণযোগ্য অর্থ নির্ধারণ করে। তবে তা’বিলের ক্ষেত্রে ব্যক্তিগত ধারণার পরিবর্তে নির্ভরযোগ্য প্রমাণ অনুসরণ করা আবশ্যক।</p><p><b>৪. উদ্দেশ্যের দিক থেকে পার্থক্য</b></p><p>তাফসিরের মাধ্যমে আয়াতের অর্থ ও বক্তব্যের উদ্দেশ্য স্পষ্ট করা হয়। তা’বিলের মাধ্যমে কোনো বক্তব্যের সম্ভাব্য অর্থ বা উদ্দেশ্য নির্ধারণ করা হয়। কুরআনে সুস্পষ্ট ও অস্পষ্ট অর্থবোধক আয়াতের কথা উল্লেখ করে বলা হয়েছে:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الَّذِي أَنْزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُحْكَمَاتٌ</div><div class=\"tr\">“তিনিই তোমার প্রতি কিতাব অবতীর্ণ করেছেন; এর মধ্যে কিছু আয়াত সুস্পষ্ট অর্থবোধক।”</div><div class=\"rf\">—সূরা আলে ইমরান: ৭-এর অংশ</div></div><p><b>৫. পরিভাষাগত ব্যবহারের দিক থেকে পার্থক্য</b></p><p>কিছু আলেম তাফসির ও তা’বিলকে সমার্থক হিসেবে ব্যবহার করেছেন। আবার অনেক আলেম উভয়ের মধ্যে পার্থক্য করেছেন। তাই এ দুটির পার্থক্য নির্ধারণের ক্ষেত্রে সংশ্লিষ্ট আলেমের পরিভাষা ও আলোচনার প্রেক্ষাপট বিবেচনা করা জরুরি।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, তাফসির ও তা’বিল উভয়ই পবিত্র কুরআনের অর্থ ও মর্ম অনুধাবনের গুরুত্বপূর্ণ মাধ্যম। তাফসির মূলত আয়াতের অর্থ স্পষ্ট করে, আর তা’বিল অনেক ক্ষেত্রে সম্ভাব্য অর্থের মধ্যে প্রমাণসমর্থিত অর্থ নির্ধারণ করে। উভয়ের মূল উদ্দেশ্য হলো কুরআনের সঠিক অর্থ অনুধাবন করা এবং এর শিক্ষা অনুযায়ী জীবন পরিচালনা করা।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">تَحَدَّثْ عَنْ خَصَائِصِ السُّورَةِ الْمَدَنِيَّةِ.</span>মাদানি সূরার বৈশিষ্ট্যগুলো আলোচনা করো।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র কুরআনের সূরাসমূহকে নাজিলের সময় ও স্থান বিবেচনায় মাক্কী ও মাদানী—এই দুই ভাগে ভাগ করা হয়। হিজরতের পরে অবতীর্ণ সূরাসমূহকে মাদানী সূরা বলা হয়; তা মদিনায় বা অন্য কোনো স্থানে অবতীর্ণ হলেও। মাদানী সূরাসমূহে ইসলামী সমাজ গঠন, শরিয়তের বিধান এবং মুসলমানদের সামাজিক ও পারিবারিক জীবন সম্পর্কে বিস্তারিত নির্দেশনা রয়েছে।</p><p><b>১. শরিয়তের বিধান বর্ণনা</b></p><p>মাদানী সূরাসমূহের অন্যতম বৈশিষ্ট্য হলো, এতে ইসলামের বিভিন্ন বিধিবিধান বিস্তারিতভাবে বর্ণিত হয়েছে। যেমন—নামাজ, রোজা, জাকাত, হজ, বিবাহ, তালাক, উত্তরাধিকার, ক্রয়-বিক্রয় এবং হালাল-হারামের বিধান। এসব বিধান মুসলমানদের ব্যক্তিগত ও সামাজিক জীবন পরিচালনায় গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</div><div class=\"tr\">“হে মুমিনগণ! তোমাদের ওপর রোজা ফরজ করা হয়েছে।”</div><div class=\"rf\">—সূরা আল-বাকারা: ১৮৩</div></div><p><b>২. সামাজিক ও পারিবারিক বিধান</b></p><p>মাদানী সূরাসমূহে পরিবার ও সমাজ পরিচালনার বিভিন্ন নিয়ম বর্ণিত হয়েছে। বিবাহ, তালাক, স্বামী-স্ত্রীর অধিকার, এতিমের সম্পদ, আত্মীয়তার সম্পর্ক এবং পারস্পরিক দায়িত্ব সম্পর্কে নির্দেশনা দেওয়া হয়েছে। এসব বিধানের উদ্দেশ্য হলো সমাজে ন্যায়বিচার প্রতিষ্ঠা করা এবং মানুষের অধিকার সংরক্ষণ করা।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ</div><div class=\"tr\">“তোমরা তাদের সঙ্গে সদ্ভাবে জীবনযাপন করো।”</div><div class=\"rf\">—সূরা আন-নিসা: ১৯</div></div><p><b>৩. মুনাফিকদের আলোচনা</b></p><p>মাদানী সূরাসমূহে মুনাফিকদের পরিচয়, তাদের অসৎ আচরণ এবং মুসলমানদের বিরুদ্ধে ষড়যন্ত্রের বিষয় আলোচনা করা হয়েছে। মদিনায় ইসলামী রাষ্ট্র প্রতিষ্ঠার পর মুনাফিকদের কার্যকলাপ মুসলিম সমাজের জন্য একটি গুরুত্বপূর্ণ সমস্যা হয়ে দাঁড়ায়। তাই এসব সূরায় তাদের বৈশিষ্ট্য তুলে ধরে মুসলমানদের সতর্ক করা হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ</div><div class=\"tr\">“নিশ্চয়ই মুনাফিকরা আল্লাহকে ধোঁকা দিতে চায়, অথচ তিনিই তাদের ধোঁকার প্রতিফল দেবেন।”</div><div class=\"rf\">—সূরা আন-নিসা: ১৪২</div></div><p><b>৪. আহলে কিতাবের আলোচনা</b></p><p>মাদানী সূরাসমূহে ইহুদি ও খ্রিষ্টানসহ আহলে কিতাবের বিশ্বাস, আচরণ এবং তাদের সঙ্গে মুসলমানদের সম্পর্ক সম্পর্কে আলোচনা করা হয়েছে। তাদের মধ্যে যারা সত্য গ্রহণ করেছে, তাদের প্রশংসা করা হয়েছে; আর যারা সত্য গোপন করেছে বা বিরোধিতা করেছে, তাদের সমালোচনা করা হয়েছে। এর মাধ্যমে মুসলমানদের সঠিক আকিদা ও ধর্মীয় পরিচয় বজায় রাখার শিক্ষা দেওয়া হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَىٰ كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ</div><div class=\"tr\">“বলুন, হে আহলে কিতাব! তোমরা এমন একটি কথার দিকে আসো, যা আমাদের ও তোমাদের মধ্যে সমান।”</div><div class=\"rf\">—সূরা আলে ইমরান: ৬৪</div></div><p><b>৫. জিহাদ ও ইসলামী সমাজ গঠন</b></p><p>মাদানী সূরাসমূহে ইসলামের প্রতিরক্ষা, জিহাদ, শান্তি, চুক্তি এবং মুসলিম সমাজের ঐক্য সম্পর্কে নির্দেশনা রয়েছে। এসব সূরায় মুসলমানদের শৃঙ্খলা, পারস্পরিক সহযোগিতা, ন্যায়বিচার এবং আল্লাহর আনুগত্যের প্রতি উৎসাহিত করা হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ</div><div class=\"tr\">“নিশ্চয়ই মুমিনরা পরস্পর ভাই ভাই।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১০</div></div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, মাদানী সূরাসমূহ ইসলামী জীবনব্যবস্থার গুরুত্বপূর্ণ দিকনির্দেশনা প্রদান করে। এতে শরিয়তের বিধান, সামাজিক ও পারিবারিক নিয়ম, মুনাফিকদের পরিচয়, আহলে কিতাবের আলোচনা এবং ইসলামী সমাজ গঠনের শিক্ষা রয়েছে। তাই মাদানী সূরাসমূহ অধ্যয়ন করলে ইসলামের পূর্ণাঙ্গ জীবনব্যবস্থা সম্পর্কে সুস্পষ্ট ধারণা লাভ করা যায়।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">مَا الْوَحْيُ؟ وَكَمْ أَقْسَامُهُ؟ بَيِّنْ أَهَمِّيَّةَ الْوَحْيِ وَضَرُورَتَهُ.</span>ওহি কী? ওহি কত প্রকার? ওহির গুরুত্ব ও প্রয়োজনীয়তা ব্যাখ্যা করো।","<div class=\"h\">ভূমিকা:</div><p>ওহী ইসলামী শরিয়তের অন্যতম প্রধান উৎস। মহান আল্লাহ তাআলা মানবজাতিকে সঠিক পথ প্রদর্শনের জন্য নবী-রাসুলগণের কাছে ওহী প্রেরণ করেছেন। ওহীর মাধ্যমে মানুষ আল্লাহর পরিচয়, ইবাদতের পদ্ধতি, নৈতিকতা এবং দুনিয়া ও আখিরাতের কল্যাণ সম্পর্কে জানতে পারে।</p><div class=\"h\">ওহীর সংজ্ঞা (تعريف الوحي):</div><p><b>আভিধানিক অর্থ:</b> ওহী শব্দের আভিধানিক অর্থ হলো গোপনে সংবাদ দেওয়া, ইঙ্গিত করা এবং দ্রুত কোনো বার্তা পৌঁছে দেওয়া।</p><p><b>পারিভাষিক অর্থ:</b> মহান আল্লাহ তাআলা তাঁর নবী-রাসুলগণের কাছে বিশেষ পদ্ধতিতে যে বাণী, নির্দেশনা ও বিধান প্রেরণ করেন, তাকে ওহী বলে।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا كَانَ لِبَشَرٍ أَنْ يُكَلِّمَهُ اللَّهُ إِلَّا وَحْيًا أَوْ مِنْ وَرَاءِ حِجَابٍ أَوْ يُرْسِلَ رَسُولًا</div><div class=\"tr\">“কোনো মানুষের পক্ষে এমন নয় যে, আল্লাহ তার সঙ্গে কথা বলবেন ওহীর মাধ্যমে, অথবা পর্দার আড়াল থেকে, অথবা কোনো বার্তাবাহক পাঠিয়ে।”</div><div class=\"rf\">—সূরা আশ-শূরা: ৫১</div></div><div class=\"h\">ওহীর প্রকারভেদ (أقسام الوحي):</div><p>ওহী প্রধানত দুই প্রকার:</p><p><b>১. ওহী তাকভীনি (الوحي التكويني)</b></p><p>মহান আল্লাহ তাআলা সৃষ্টিজগতের বিভিন্ন সৃষ্টিকে যেভাবে নির্দেশনা দেন ও পরিচালনা করেন, তাকে ওহী তাকভীনি বলা হয়। এটি নবী-রাসুলদের কাছে শরিয়তের বিধান প্রেরণের ওহী থেকে আলাদা।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَوْحَىٰ رَبُّكَ إِلَى النَّحْلِ</div><div class=\"tr\">“আর তোমার রব মৌমাছিকে নির্দেশ দিয়েছেন।”</div><div class=\"rf\">—সূরা আন-নাহল: ৬৮</div></div><p><b>২. ওহী তাশরীঈ (الوحي التشريعي)</b></p><p>যে ওহীর মাধ্যমে মহান আল্লাহ তাআলা নবী-রাসুলগণের কাছে মানুষের জন্য আকিদা, ইবাদত, হালাল-হারাম এবং জীবন পরিচালনার শরিয়তসম্মত বিধান প্রেরণ করেন, তাকে ওহী তাশরীঈ বলে। ওহী তাশরীঈ আবার দুই প্রকার:</p><p><b>ক. ওহী মাতলু (الوحي المتلو)</b></p><p>যে ওহী তিলাওয়াত করা হয় এবং যার শব্দ ও অর্থ আল্লাহর পক্ষ থেকে অবতীর্ণ, তাকে ওহী মাতলু বলে। পবিত্র আল-কুরআন এর উদাহরণ।</p><p><b>খ. ওহী গায়রে মাতলু (الوحي غير المتلو)</b></p><p>যে ওহী কুরআনের মতো তিলাওয়াত করা হয় না, তাকে ওহী গায়রে মাতলু বলে। কুরআনের বাইরে রাসুলুল্লাহ ﷺ-এর প্রতি প্রেরিত ওহীভিত্তিক নির্দেশনা সাধারণত এর অন্তর্ভুক্ত।</p><div class=\"h\">ওহীর গুরুত্ব ও প্রয়োজনীয়তা (أهمية الوحي وضروريته):</div><p><b>১. আল্লাহর পরিচয় লাভের মাধ্যম</b></p><p>ওহীর মাধ্যমে মানুষ আল্লাহ তাআলার পরিচয়, গুণাবলি এবং তাঁর সন্তুষ্টি অর্জনের উপায় জানতে পারে। শুধু বিবেকের সাহায্যে এসব বিষয়ে পূর্ণাঙ্গ জ্ঞান লাভ করা সম্ভব নয়।</p><p><b>২. হিদায়াতের প্রধান উৎস</b></p><p>ওহী মানুষকে সত্য ও মিথ্যার পার্থক্য বুঝিয়ে সঠিক জীবনপথ দেখায়। এর মাধ্যমে মানুষ ভ্রান্ত বিশ্বাস ও অন্যায় কাজ থেকে বেঁচে থাকতে পারে।</p><p><b>৩. ইবাদতের বিধান জানার মাধ্যম</b></p><p>নামাজ, রোজা, যাকাত ও হজের বিধান এবং সেগুলো পালনের পদ্ধতি ওহীর মাধ্যমে জানা যায়। তাই সঠিকভাবে আল্লাহর ইবাদত করার জন্য ওহী অপরিহার্য।</p><p><b>৪. নৈতিক ও সামাজিক জীবন গঠনের ভিত্তি</b></p><p>ওহী মানুষকে সততা, ন্যায়বিচার, দয়া, ক্ষমা ও উত্তম চরিত্রের শিক্ষা দেয়। পাশাপাশি পরিবার ও সমাজে শান্তি ও শৃঙ্খলা প্রতিষ্ঠার নির্দেশনা প্রদান করে।</p><p><b>৫. আখিরাত সম্পর্কে জ্ঞান লাভ</b></p><p>জান্নাত, জাহান্নাম, পুনরুত্থান, হিসাব-নিকাশ ও পরকাল সম্পর্কে নির্ভরযোগ্য জ্ঞান ওহীর মাধ্যমে পাওয়া যায়। এসব শিক্ষা মানুষকে সৎকর্মে উৎসাহিত করে এবং অন্যায় থেকে বিরত রাখে।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ</div><div class=\"tr\">“এটি তো কেবল ওহী, যা তাঁর প্রতি প্রেরণ করা হয়।”</div><div class=\"rf\">—সূরা আন-নাজম: ৪</div></div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, ওহী মানবজাতির জন্য মহান আল্লাহ তাআলার বিশেষ অনুগ্রহ। এটি মানুষের আকিদা, ইবাদত, নৈতিকতা ও জীবন পরিচালনার সঠিক দিকনির্দেশনা দেয়। তাই ইসলামী জীবনব্যবস্থা সঠিকভাবে বোঝা ও পালন করার জন্য ওহীর গুরুত্ব ও প্রয়োজনীয়তা অপরিসীম।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">اكْتُبْ أَسْمَاءَ الْقُرْآنِ الْكَرِيمِ مَعَ ذِكْرِ النُّصُوصِ.</span>কুরআন কারিমের নামগুলো প্রমাণসহ লেখো।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র আল-কুরআন মহান আল্লাহ তাআলার পক্ষ থেকে অবতীর্ণ সর্বশেষ আসমানি কিতাব। এটি সমগ্র মানবজাতির হিদায়াতের উৎস। আল্লাহ তাআলা কুরআনুল কারীমকে বিভিন্ন নামে অভিহিত করেছেন। এসব নামের মাধ্যমে কুরআনের মর্যাদা, বৈশিষ্ট্য ও গুরুত্ব প্রকাশ পেয়েছে। নিম্নে কুরআনুল কারীমের পাঁচটি প্রসিদ্ধ নাম দলিলসহ আলোচনা করা হলো।</p><div class=\"h\">আল-কুরআনের নামসমূহ:</div><p><b>১. আল-কুরআন (القرآن)</b></p><p>আল-কুরআন অর্থ পঠিত গ্রন্থ। এটি মহান আল্লাহর কালাম, যা জিবরাইল (আ.)-এর মাধ্যমে মহানবী হজরত মুহাম্মদ (সা.)-এর ওপর অবতীর্ণ হয়েছে। মুসলমানরা এই কিতাব তিলাওয়াত করে, এর অর্থ বোঝে এবং এর নির্দেশনা অনুযায়ী জীবন পরিচালনা করে। কুরআন মানুষকে সঠিক পথের সন্ধান দেয়।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ</div><div class=\"tr\">“নিশ্চয়ই এই কুরআন এমন পথের নির্দেশনা দেয়, যা সর্বাধিক সরল।”</div><div class=\"rf\">—সূরা আল-ইসরা: ৯</div></div><p><b>২. আল-কিতাব (الكتاب)</b></p><p>আল-কিতাব অর্থ গ্রন্থ বা লিখিত কিতাব। পবিত্র কুরআনকে আল-কিতাব বলা হয়েছে, কারণ এটি আল্লাহর পক্ষ থেকে অবতীর্ণ একটি পূর্ণাঙ্গ আসমানি গ্রন্থ। এতে মানুষের আকিদা, ইবাদত, নৈতিকতা ও জীবন পরিচালনার বিভিন্ন নির্দেশনা রয়েছে। এটি মুমিনদের জন্য হিদায়াতের অন্যতম প্রধান উৎস।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ</div><div class=\"tr\">“এটি সেই কিতাব, যাতে কোনো সন্দেহ নেই; মুত্তাকিদের জন্য হিদায়াত।”</div><div class=\"rf\">—সূরা আল-বাকারা: ২</div></div><p><b>৩. আল-ফুরকান (الفرقان)</b></p><p>আল-ফুরকান অর্থ সত্য ও মিথ্যার মধ্যে পার্থক্যকারী। কুরআন মানুষকে সত্য ও অসত্য, ন্যায় ও অন্যায় এবং সঠিক ও ভুলের পার্থক্য বুঝতে সাহায্য করে। এর বিধান অনুসরণ করলে মানুষ ভ্রান্তি থেকে বেঁচে থাকতে পারে এবং আল্লাহর সন্তুষ্টি অর্জনের পথে চলতে পারে।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ عَلَىٰ عَبْدِهِ</div><div class=\"tr\">“বরকতময় তিনি, যিনি তাঁর বান্দার ওপর ফুরকান অবতীর্ণ করেছেন।”</div><div class=\"rf\">—সূরা আল-ফুরকান: ১</div></div><p><b>৪. আয-যিকর (الذِّكْر)</b></p><p>আয-যিকর অর্থ স্মরণ, উপদেশ বা স্মারক। কুরআন মানুষকে মহান আল্লাহর কথা স্মরণ করিয়ে দেয় এবং তাঁর আদেশ-নিষেধ মেনে চলার উপদেশ দেয়। এটি মানুষের অন্তরকে পরিশুদ্ধ করে, ঈমানকে দৃঢ় করে এবং আখিরাতের কথা স্মরণ করিয়ে দেয়। আল্লাহ তাআলা নিজেই কুরআন সংরক্ষণের দায়িত্ব গ্রহণ করেছেন।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div><div class=\"tr\">“নিশ্চয়ই আমরাই যিকর অবতীর্ণ করেছি এবং আমরাই এর সংরক্ষণকারী।”</div><div class=\"rf\">—সূরা আল-হিজর: ৯</div></div><p><b>৫. আন-নূর (النُّور)</b></p><p>আন-নূর অর্থ আলো বা জ্যোতি। কুরআনকে নূর বলা হয়, কারণ এটি মানুষকে অজ্ঞতা, ভ্রান্তি ও পথভ্রষ্টতার অন্ধকার থেকে বের করে সত্যের আলো দেখায়। কুরআনের শিক্ষা অনুসরণ করলে মানুষ সঠিক আকিদা, উত্তম চরিত্র ও সুন্দর জীবন গঠনের দিশা পায়।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَدْ جَاءَكُمْ مِنَ اللَّهِ نُورٌ وَكِتَابٌ مُبِينٌ</div><div class=\"tr\">“নিশ্চয়ই তোমাদের কাছে আল্লাহর পক্ষ থেকে এক আলো ও সুস্পষ্ট কিতাব এসেছে।”</div><div class=\"rf\">—সূরা আল-মায়িদা: ১৫</div></div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, পবিত্র কুরআনের বিভিন্ন নাম এর মহত্ত্ব ও বৈশিষ্ট্য প্রকাশ করে। কুরআন হিদায়াতের গ্রন্থ, সত্য-মিথ্যার পার্থক্যকারী, উপদেশ এবং আলোর উৎস। তাই প্রত্যেক মুসলমানের কর্তব্য হলো কুরআন তিলাওয়াত করা, এর অর্থ অনুধাবন করা এবং এর শিক্ষা অনুযায়ী জীবন পরিচালনা করা।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">اكْتُبْ خَصَائِصَ الْقُرْآنِ بِإِيجَازٍ.</span>কুরআনের বৈশিষ্ট্যগুলো সংক্ষেপে লেখো।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র আল-কুরআন মহান আল্লাহ তাআলার বাণী। মানবজাতির হিদায়াতের জন্য এটি হজরত মুহাম্মদ (সা.)-এর ওপর অবতীর্ণ হয়েছে। এটি সর্বশেষ আসমানি কিতাব এবং মানুষের দুনিয়া ও আখিরাতের মুক্তির পথপ্রদর্শক।</p><p><b>১. আল্লাহর বাণী</b></p><p>পবিত্র কুরআন মহান আল্লাহ তাআলার কালাম। এটি কোনো মানুষের রচনা নয়; বরং ফেরেশতা জিবরাইল (আ.)-এর মাধ্যমে মহানবী হজরত মুহাম্মদ (সা.)-এর ওপর অবতীর্ণ হয়েছে। কুরআনের মাধ্যমে মানুষ আল্লাহর পরিচয়, তাঁর আদেশ-নিষেধ এবং সঠিক জীবনপদ্ধতি জানতে পারে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">تَنْزِيلٌ مِنْ رَبِّ الْعَالَمِينَ</div><div class=\"tr\">“এটি সমগ্র জগতের প্রতিপালকের পক্ষ থেকে অবতীর্ণ।”</div><div class=\"rf\">—সূরা আল-ওয়াকিয়া: ৮০</div></div><p><b>২. সর্বশেষ আসমানি কিতাব</b></p><p>আল-কুরআন সর্বশেষ আসমানি কিতাব, যা সর্বশেষ নবী হজরত মুহাম্মদ (সা.)-এর ওপর অবতীর্ণ হয়েছে। এর শিক্ষা সমগ্র মানবজাতির জন্য প্রযোজ্য এবং এর বিধান কিয়ামত পর্যন্ত কার্যকর থাকবে। এটি পূর্ববর্তী নবীদের শিক্ষার সত্যতা স্বীকার করে এবং মানুষকে আল্লাহর আনুগত্যের পথে পরিচালিত করে।</p><p>রাসুলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَخُتِمَ بِيَ النَّبِيُّونَ</div><div class=\"tr\">“আমার মাধ্যমে নবীদের ধারার সমাপ্তি ঘটেছে।”</div><div class=\"rf\">—সহিহ মুসলিম</div></div><p><b>৩. বিকৃতি থেকে সংরক্ষিত</b></p><p>পবিত্র কুরআনের অন্যতম বৈশিষ্ট্য হলো, মহান আল্লাহ একে বিকৃতি ও পরিবর্তন থেকে সংরক্ষণ করেছেন। যুগে যুগে মুসলমানেরা কুরআন মুখস্থ করেছেন, লিখিতভাবে সংরক্ষণ করেছেন এবং পরবর্তী প্রজন্মের কাছে পৌঁছে দিয়েছেন। ফলে কুরআন তার মূল রূপে সংরক্ষিত রয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div><div class=\"tr\">“নিশ্চয়ই আমিই এই উপদেশবাণী অবতীর্ণ করেছি এবং আমিই এর সংরক্ষক।”</div><div class=\"rf\">—সূরা আল-হিজর: ৯</div></div><p><b>৪. চিরন্তন মুজিজা</b></p><p>কুরআন মহানবী (সা.)-এর চিরন্তন মুজিজা। এর ভাষা, শব্দচয়ন, বর্ণনাশৈলী ও অর্থের গভীরতা অতুলনীয়। মানুষ ও জিন একত্র হয়েও এর অনুরূপ কিছু রচনা করতে সক্ষম নয়। কুরআনের এই অনন্য বৈশিষ্ট্য এর সত্যতা ও আল্লাহর পক্ষ থেকে অবতীর্ণ হওয়ার প্রমাণ বহন করে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ لَئِنِ اجْتَمَعَتِ الْإِنْسُ وَالْجِنُّ عَلَىٰ أَنْ يَأْتُوا بِمِثْلِ هَٰذَا الْقُرْآنِ لَا يَأْتُونَ بِمِثْلِهِ</div><div class=\"tr\">“বলুন, মানুষ ও জিন যদি এই কুরআনের অনুরূপ কিছু রচনা করার জন্য একত্র হয়, তবুও তারা এর অনুরূপ কিছু রচনা করতে পারবে না।”</div><div class=\"rf\">—সূরা আল-ইসরা: ৮৮</div></div><p><b>৫. মানবজাতির হিদায়াত ও জীবনবিধান</b></p><p>কুরআন সমগ্র মানবজাতির জন্য হিদায়াতের উৎস। এতে আকিদা, ইবাদত, নৈতিকতা, পারিবারিক জীবন, সামাজিক সম্পর্ক, ন্যায়বিচার ও লেনদেন সম্পর্কে নির্দেশনা রয়েছে। এটি মানুষকে সত্যবাদিতা, ন্যায়পরায়ণতা ও উত্তম চরিত্রের শিক্ষা দেয় এবং অন্যায় ও অসৎকাজ থেকে বিরত থাকতে নির্দেশ দেয়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ</div><div class=\"tr\">“নিশ্চয়ই এই কুরআন এমন পথ দেখায়, যা সবচেয়ে সরল।”</div><div class=\"rf\">—সূরা আল-ইসরা: ৯</div></div><p>রাসুলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ</div><div class=\"tr\">“তোমাদের মধ্যে সর্বোত্তম ব্যক্তি সে, যে কুরআন শেখে এবং অন্যকে শেখায়।”</div><div class=\"rf\">—সহিহ বুখারি, হাদিস: ৫০২৭</div></div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, পবিত্র কুরআন মহান আল্লাহর বাণী, সর্বশেষ আসমানি কিতাব, চিরন্তন মুজিজা এবং মানবজাতির হিদায়াতের উৎস। তাই প্রত্যেক মুসলমানের কর্তব্য হলো কুরআন তিলাওয়াত করা, এর অর্থ বোঝা এবং জীবনের প্রতিটি ক্ষেত্রে এর শিক্ষা অনুসরণ করা।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">ما العلوم التي يحتاج إليها المفسر؟ بيّن موضحًا</span>মুফাসসিরের জন্য প্রয়োজনীয় বিদ্যাসমূহ কী কী? স্পষ্টভাবে বর্ণনা কর।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র আল-কুরআন মহান আল্লাহ তাআলার কালাম এবং মানবজাতির হিদায়াতের প্রধান উৎস। কুরআনের আয়াতসমূহের সঠিক অর্থ, উদ্দেশ্য ও বিধান ব্যাখ্যা করার জন্য মুফাসসিরের বিভিন্ন শাস্ত্রে জ্ঞান থাকা আবশ্যক। এসব বিদ্যার সাহায্যে তিনি আয়াতের সঠিক অর্থ অনুধাবন করতে এবং ভুল ব্যাখ্যা থেকে বিরত থাকতে পারেন।</p><div class=\"h\">মুফাসসিরের জন্য প্রয়োজনীয় বিদ্যাসমূহ:</div><p><b>১. ইলমুল লুগাহ (علم اللغة)</b></p><p>আরবি ভাষার শব্দভাণ্ডার ও শব্দের অর্থ সম্পর্কে জ্ঞানকে ইলমুল লুগাহ বলে। কুরআন আরবি ভাষায় অবতীর্ণ হওয়ায় প্রতিটি শব্দের অর্থ ও ব্যবহার জানা মুফাসসিরের জন্য অপরিহার্য।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَعَلَّكُمْ تَعْقِلُونَ</div><div class=\"tr\">“নিশ্চয়ই আমি একে আরবি কুরআনরূপে অবতীর্ণ করেছি, যাতে তোমরা বুঝতে পারো।”</div><div class=\"rf\">—সূরা ইউসুফ: ২</div></div><p><b>২. ইলমুন নাহু (علم النحو)</b></p><p>আরবি বাক্যে শব্দের অবস্থান, পারস্পরিক সম্পর্ক এবং ই‘রাব সম্পর্কে আলোচনাকারী শাস্ত্রকে ইলমুন নাহু বলে। এ জ্ঞানের মাধ্যমে বাক্যের অর্থ সঠিকভাবে বোঝা যায় এবং শব্দের অবস্থানজনিত ভুল ব্যাখ্যা থেকে রক্ষা পাওয়া যায়।</p><p><b>৩. ইলমুস সরফ (علم الصرف)</b></p><p>আরবি শব্দের গঠন, ধাতু ও রূপান্তর সম্পর্কে জ্ঞানকে ইলমুস সরফ বলে। এ বিদ্যার সাহায্যে শব্দের মূল অর্থ এবং বিভিন্ন রূপের কারণে অর্থের পরিবর্তন বোঝা যায়।</p><p><b>৪. ইলমুল বালাগাহ (علم البلاغة)</b></p><p>আরবি ভাষার অলংকার, উপমা, রূপক এবং বক্তব্য প্রকাশের বিশেষ পদ্ধতি সম্পর্কে জ্ঞানকে ইলমুল বালাগাহ বলে। কুরআনের ভাষার সৌন্দর্য, গভীরতা ও অর্থের সূক্ষ্মতা বুঝতে এ জ্ঞান প্রয়োজন।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِي هَٰذَا الْقُرْآنِ مِنْ كُلِّ مَثَلٍ</div><div class=\"tr\">“নিশ্চয়ই আমি মানুষের জন্য এই কুরআনে সব ধরনের দৃষ্টান্ত বর্ণনা করেছি।”</div><div class=\"rf\">—সূরা আয-যুমার: ২৭</div></div><p><b>৫. ইলমুল কিরাআত (علم القراءات)</b></p><p>কুরআন তিলাওয়াতের স্বীকৃত পদ্ধতি ও কিরাআতের পার্থক্য সম্পর্কে জ্ঞানকে ইলমুল কিরাআত বলে। কোনো কোনো আয়াতে স্বীকৃত কিরাআতের পার্থক্যের মাধ্যমে অর্থের সূক্ষ্মতা প্রকাশ পায়। তাই সঠিক তাফসিরের জন্য এ বিদ্যা গুরুত্বপূর্ণ।</p><p><b>৬. ইলমে আসবাবুন নুযুল (علم أسباب النزول)</b></p><p>কুরআনের আয়াত অবতীর্ণ হওয়ার পেছনের ঘটনা ও পরিস্থিতি সম্পর্কে জ্ঞানকে ইলমে আসবাবুন নুযুল বলে। এর মাধ্যমে আয়াতের প্রেক্ষাপট, উদ্দেশ্য এবং সঠিক তাৎপর্য অনুধাবন করা যায়।</p><p><b>৭. ইলমুন নাসিখ ওয়াল মানসুখ (علم الناسخ والمنسوخ)</b></p><p>কুরআনের কোনো বিধান রহিত হওয়া এবং তার পরিবর্তে অন্য বিধান কার্যকর হওয়া সম্পর্কে জ্ঞানকে ইলমুন নাসিখ ওয়াল মানসুখ বলে। কোন বিধান কার্যকর রয়েছে, তা নির্ধারণ করতে এ বিদ্যা গুরুত্বপূর্ণ।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُنْسِهَا نَأْتِ بِخَيْرٍ مِنْهَا أَوْ مِثْلِهَا</div><div class=\"tr\">“আমি কোনো আয়াত রহিত করলে বা ভুলিয়ে দিলে তার চেয়ে উত্তম অথবা তার অনুরূপ আয়াত নিয়ে আসি।”</div><div class=\"rf\">—সূরা আল-বাকারা: ১০৬</div></div><p><b>৮. ইলমুল হাদিস (علم الحديث)</b></p><p>রাসুলুল্লাহ ﷺ-এর বাণী, কর্ম ও অনুমোদন সম্পর্কে জ্ঞানকে ইলমুল হাদিস বলে। হাদিসের মাধ্যমে কুরআনের অনেক আয়াতের ব্যাখ্যা, বিধান ও বাস্তব প্রয়োগ জানা যায়। তাই মুফাসসিরের জন্য নির্ভরযোগ্য হাদিস সম্পর্কে জ্ঞান থাকা অপরিহার্য।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنْزَلْنَا إِلَيْكَ الذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ</div><div class=\"tr\">“আর আমি তোমার প্রতি যিকর অবতীর্ণ করেছি, যাতে মানুষের জন্য যা অবতীর্ণ করা হয়েছে, তা তুমি তাদের কাছে স্পষ্টভাবে ব্যাখ্যা করো।”</div><div class=\"rf\">—সূরা আন-নাহল: ৪৪</div></div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, কুরআনের সঠিক তাফসিরের জন্য আরবি ভাষা, নাহু, সরফ, বালাগাহ, কিরাআত, আসবাবুন নুযুল, নাসিখ-মানসুখ ও হাদিসসহ বিভিন্ন শাস্ত্রে জ্ঞান থাকা প্রয়োজন। এসব বিদ্যার সমন্বয়ে একজন মুফাসসির কুরআনের অর্থ ও উদ্দেশ্য যথাযথভাবে ব্যাখ্যা করতে সক্ষম হন।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">اكتب خمس آيات نزلت ليلاً</span>রাতে অবতীর্ণ হয়েছে এমন পাঁচটি আয়াত লেখ।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র আল-কুরআনের আয়াতসমূহ বিভিন্ন সময় ও পরিস্থিতিতে মহান আল্লাহ তাআলার পক্ষ থেকে অবতীর্ণ হয়েছে। এর মধ্যে কিছু আয়াত রাতে অবতীর্ণ হয়েছে। নিম্নে রাতে অবতীর্ণ হয়েছে এমন পাঁচটি পূর্ণাঙ্গ আয়াত উল্লেখ করা হলো।</p><div class=\"h\">রাতে অবতীর্ণ পাঁচটি আয়াত:</div><p><b>১. সূরা আল-হাজ্জ, আয়াত: ১</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمْ إِنَّ زَلْزَلَةَ السَّاعَةِ شَيْءٌ عَظِيمٌ</div><div class=\"tr\">অর্থ: হে মানুষ! তোমরা তোমাদের রবকে ভয় করো। নিশ্চয়ই কিয়ামতের প্রকম্পন এক ভয়ংকর বিষয়।</div></div><p><b>২. সূরা আল-মায়িদা, আয়াত: ৬৭</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ وَإِنْ لَمْ تَفْعَلْ فَمَا بَلَّغْتَ رِسَالَتَهُ وَاللَّهُ يَعْصِمُكَ مِنَ النَّاسِ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ</div><div class=\"tr\">অর্থ: হে রাসুল! আপনার রবের পক্ষ থেকে আপনার প্রতি যা অবতীর্ণ হয়েছে, তা পৌঁছে দিন। যদি আপনি তা না করেন, তবে তাঁর বার্তা পৌঁছানো হলো না। আর আল্লাহ আপনাকে মানুষের অনিষ্ট থেকে রক্ষা করবেন। নিশ্চয়ই আল্লাহ অবিশ্বাসী সম্প্রদায়কে হিদায়াত দেন না।</div></div><p><b>৩. সূরা আল-কাসাস, আয়াত: ৫৬</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</div><div class=\"tr\">অর্থ: নিশ্চয়ই আপনি যাকে ভালোবাসেন, তাকে হিদায়াত দিতে পারেন না; বরং আল্লাহ যাকে ইচ্ছা হিদায়াত দেন। আর কে হিদায়াতপ্রাপ্ত, তা তিনি ভালো জানেন।</div></div><p><b>৪. সূরা আয-যুখরুফ, আয়াত: ৪৫</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاسْأَلْ مَنْ أَرْسَلْنَا مِنْ قَبْلِكَ مِنْ رُسُلِنَا أَجَعَلْنَا مِنْ دُونِ الرَّحْمَٰنِ آلِهَةً يُعْبَدُونَ</div><div class=\"tr\">অর্থ: আর আপনার আগে আমি যেসব রাসুল পাঠিয়েছিলাম, তাদের জিজ্ঞাসা করুন, আমি কি রহমান ছাড়া এমন উপাস্য নির্ধারণ করেছিলাম, যাদের ইবাদত করা হতো?</div></div><p><b>৫. সূরা আল-ফাতহ, আয়াত: ১</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا فَتَحْنَا لَكَ فَتْحًا مُبِينًا</div><div class=\"tr\">অর্থ: নিশ্চয়ই আমি আপনাকে সুস্পষ্ট বিজয় দান করেছি।</div></div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, রাতে অবতীর্ণ আয়াতসমূহ কুরআন নাজিলের ইতিহাসের গুরুত্বপূর্ণ অংশ। এসব আয়াত সম্পর্কে জানা কুরআনের অবতরণের সময় ও প্রেক্ষাপট অনুধাবনে সহায়তা করে।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">ما معنى الترجمة؟ بيّن مع ذكر أنواعها ممثّلًا</span>তরজমা বলতে কী বোঝায়? এর প্রকারভেদ উদাহরণসহ বর্ণনা কর।","<div class=\"h\">ভূমিকা:</div><p>পবিত্র আল-কুরআন আরবি ভাষায় অবতীর্ণ হয়েছে। পৃথিবীর বিভিন্ন ভাষাভাষী মানুষের কাছে কুরআনের বাণী পৌঁছে দেওয়ার জন্য তরজমার গুরুত্ব অপরিসীম। তরজমার মাধ্যমে এক ভাষার বক্তব্য অন্য ভাষায় প্রকাশ করা হয়, যাতে মানুষ মূল বক্তব্যের অর্থ বুঝতে পারে।</p><div class=\"h\">তরজমার অর্থ (معنى الترجمة):</div><p><b>আভিধানিক অর্থ:</b> তরজমা শব্দের অর্থ হলো অনুবাদ করা, ব্যাখ্যা করা এবং এক ভাষার বক্তব্য অন্য ভাষায় প্রকাশ করা।</p><p><b>পারিভাষিক অর্থ:</b> এক ভাষার বক্তব্যের অর্থ ও উদ্দেশ্য অন্য ভাষায় যথাসম্ভব সঠিকভাবে প্রকাশ করাকে তরজমা বলে।</p><div class=\"h\">তরজমার প্রকারভেদ (أنواع الترجمة):</div><p>তরজমা প্রধানত দুই প্রকার।</p><p><b>১. তরজমাতুল হারফিয়্যাহ (الترجمة الحرفية)</b></p><p>মূল ভাষার প্রতিটি শব্দের ক্রম ও গঠন যথাসম্ভব অক্ষুণ্ণ রেখে অন্য ভাষায় অনুবাদ করাকে তরজমাতুল হারফিয়্যাহ বলে। এ পদ্ধতিতে মূল ভাষার শব্দ ও বাক্যগঠনের অনুসরণ করা হয়। তবে ভাষাগত পার্থক্যের কারণে সব সময় মূল বক্তব্যের পূর্ণ অর্থ প্রকাশ করা সম্ভব হয় না।</p><p>উদাহরণ:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</div><div class=\"tr\">শব্দানুগ অনুবাদ: সমস্ত প্রশংসা আল্লাহর জন্য, যিনি বিশ্বজগতের রব।</div><div class=\"rf\">—সূরা আল-ফাতিহা: ২</div></div><p><b>২. তরজমাতুত তাফসিরিয়্যাহ (الترجمة التفسيرية)</b></p><p>মূল বক্তব্যের শব্দক্রম হুবহু অনুসরণ না করে তার অর্থ ও উদ্দেশ্য স্পষ্টভাবে অন্য ভাষায় প্রকাশ করাকে তরজমাতুত তাফসিরিয়্যাহ বলে। এ পদ্ধতিতে মূল বক্তব্যের ভাব ও মর্ম অক্ষুণ্ণ রেখে পাঠকের বোধগম্য ভাষায় অনুবাদ করা হয়।</p><p>উদাহরণ:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</div><div class=\"tr\">অনুবাদ: আমরা একমাত্র আপনারই ইবাদত করি এবং একমাত্র আপনারই সাহায্য প্রার্থনা করি।</div><div class=\"rf\">—সূরা আল-ফাতিহা: ৫</div></div><p>এখানে মূল বক্তব্যের অর্থ ও উদ্দেশ্য বাংলা ভাষায় স্পষ্টভাবে প্রকাশ করা হয়েছে।</p><div class=\"h\">উভয় প্রকার তরজমার গুরুত্ব:</div><p>হারফিয়্যাহ তরজমায় মূল শব্দের সঙ্গে অনুবাদের সম্পর্ক বজায় রাখার চেষ্টা করা হয়। অন্যদিকে, তাফসিরিয়্যাহ তরজমায় মূল বক্তব্যের অর্থ ও উদ্দেশ্য সহজভাবে বোঝানোর প্রতি গুরুত্ব দেওয়া হয়। বিশেষ করে কুরআনের অর্থ বোঝানোর ক্ষেত্রে ভাষাগত নিয়ম, প্রসঙ্গ ও নির্ভরযোগ্য তাফসিরের জ্ঞান থাকা জরুরি।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, তরজমা এক ভাষার বক্তব্য অন্য ভাষায় প্রকাশ করার গুরুত্বপূর্ণ মাধ্যম। তরজমা প্রধানত হারফিয়্যাহ ও তাফসিরিয়্যাহ—এই দুই প্রকার। কুরআনের অনুবাদের ক্ষেত্রে মূল বক্তব্যের যথার্থতা বজায় রাখা এবং তার অর্থ ও উদ্দেশ্য সঠিকভাবে প্রকাশ করা অত্যন্ত গুরুত্বপূর্ণ।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">ما الفرق بين القرآن والحديث والحديث القدسي؟ بيّن</span>আল-কুরআন, হাদিস এবং হাদিসে কুদসির মধ্যে পার্থক্য কী? বর্ণনা কর।","<div class=\"h\">ভূমিকা:</div><p>ইসলামী শরিয়তের গুরুত্বপূর্ণ বিষয়গুলোর মধ্যে আল-কুরআন, হাদিস ও হাদিসে কুদসি বিশেষ স্থান অধিকার করে। এগুলোর মাধ্যমে ইসলামের আকিদা, ইবাদত, নৈতিকতা ও জীবন পরিচালনার নির্দেশনা পাওয়া যায়। তবে এগুলোর পরিচয়, মর্যাদা ও বৈশিষ্ট্যের মধ্যে কিছু মৌলিক পার্থক্য রয়েছে।</p><div class=\"h\">আল-কুরআনের পরিচয় (تعريف القرآن):</div><p>আল-কুরআন হলো মহান আল্লাহ তাআলার সেই কালাম, যা জিবরাইল (আ.)-এর মাধ্যমে মহানবী হজরত মুহাম্মদ (সা.)-এর ওপর অবতীর্ণ হয়েছে, মুসহাফে লিপিবদ্ধ রয়েছে এবং যার তিলাওয়াত ইবাদত হিসেবে গণ্য হয়।</p><p>দলিল:</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div><div class=\"tr\">“নিশ্চয়ই আমরাই এই উপদেশগ্রন্থ অবতীর্ণ করেছি এবং আমরাই এর সংরক্ষণকারী।”</div><div class=\"rf\">—সূরা আল-হিজর: ৯</div></div><div class=\"h\">হাদিসের পরিচয় (تعريف الحديث):</div><p>হাদিস হলো মহানবী হজরত মুহাম্মদ (সা.)-এর বাণী, কর্ম, মৌনসম্মতি এবং তাঁর চারিত্রিক ও গুণগত বৈশিষ্ট্যসংক্রান্ত বর্ণনা। হাদিসের মাধ্যমে কুরআনের বিধান ব্যাখ্যা করা হয় এবং ইসলামী জীবন পরিচালনার বিভিন্ন নির্দেশনা জানা যায়।</p><div class=\"h\">হাদিসে কুদসির পরিচয় (تعريف الحديث القدسي):</div><p>হাদিসে কুদসি হলো এমন হাদিস, যেখানে রাসুলুল্লাহ (সা.) মহান আল্লাহর পক্ষ থেকে কোনো বক্তব্য বর্ণনা করেন। সাধারণত তিনি বলেন, “আল্লাহ তাআলা বলেছেন।” হাদিসে কুদসি কুরআনের অন্তর্ভুক্ত নয় এবং এর তিলাওয়াত কুরআনের তিলাওয়াতের মতো ইবাদত হিসেবে নির্ধারিত নয়।</p><div class=\"h\">আল-কুরআন, হাদিস ও হাদিসে কুদসির পার্থক্য:</div><p><b>১. উৎস ও বক্তব্যের দিক থেকে</b></p><p>আল-কুরআন মহান আল্লাহর কালাম, যা কুরআন হিসেবে অবতীর্ণ হয়েছে। হাদিসে রাসুলুল্লাহ (সা.)-এর বাণী, কর্ম ও অনুমোদন বর্ণিত হয়। হাদিসে কুদসিতে রাসুলুল্লাহ (সা.) আল্লাহর পক্ষ থেকে বক্তব্য বর্ণনা করেন।</p><p><b>২. শব্দ ও অর্থের দিক থেকে</b></p><p>কুরআনের শব্দ ও অর্থ উভয়ই আল্লাহর পক্ষ থেকে অবতীর্ণ। সাধারণ হাদিসে রাসুলুল্লাহ (সা.)-এর বক্তব্য ও নির্দেশনা বর্ণিত হয়। হাদিসে কুদসির অর্থ আল্লাহর পক্ষ থেকে বর্ণিত হলেও এর শব্দ রাসুলুল্লাহ (সা.)-এর মাধ্যমে বর্ণিত হয়েছে—এ বিষয়ে আলেমদের মধ্যে আলোচনা রয়েছে।</p><p><b>৩. তিলাওয়াতের দিক থেকে</b></p><p>কুরআনের তিলাওয়াত স্বতন্ত্র ইবাদত এবং নামাজে কুরআন পাঠ করা আবশ্যক। সাধারণ হাদিস ও হাদিসে কুদসি পাঠ করা সওয়াবের কাজ হলেও এগুলো কুরআনের তিলাওয়াতের বিধান লাভ করে না।</p><p><b>৪. সংরক্ষণ ও প্রামাণিকতার দিক থেকে</b></p><p>কুরআন সম্পূর্ণভাবে সংরক্ষিত এবং এর প্রতিটি আয়াত অকাট্যভাবে প্রমাণিত। অন্যদিকে, হাদিস ও হাদিসে কুদসির বর্ণনাগুলো সনদের ভিত্তিতে সহিহ, হাসান বা দুর্বল হতে পারে।</p><p><b>৫. শরিয়তের বিধানের দিক থেকে</b></p><p>কুরআন ইসলামী শরিয়তের প্রধান উৎস। হাদিস কুরআনের ব্যাখ্যা করে এবং অনেক বিধান বিস্তারিতভাবে তুলে ধরে। হাদিসে কুদসিও গ্রহণযোগ্য হলে শরিয়তের দলিল হিসেবে বিবেচিত হতে পারে, তবে তা কুরআনের মর্যাদা ও বৈশিষ্ট্যের সমান নয়।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, আল-কুরআন, হাদিস ও হাদিসে কুদসি ইসলামের গুরুত্বপূর্ণ জ্ঞানভাণ্ডার। তবে কুরআন আল্লাহর অবতীর্ণ কালাম ও স্বতন্ত্র ইবাদত হিসেবে তিলাওয়াতযোগ্য; হাদিস রাসুলুল্লাহ (সা.)-এর বাণী, কর্ম ও অনুমোদনের বিবরণ; আর হাদিসে কুদসি হলো আল্লাহর পক্ষ থেকে রাসুলুল্লাহ (সা.)-এর মাধ্যমে বর্ণিত বক্তব্য।</p>"]]}]}})();
